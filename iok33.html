  <script>
    var IOK_ERRORS = [];
    window.onerror = function(msg, src, line, col, err) {
      IOK_ERRORS.push({msg:msg, src:src, line:line, err:err?err.stack:""});
      var el = document.getElementById("splash-loader");
      if(el) {
        el.style.opacity="1"; el.style.display="flex"; el.style.alignItems="flex-start"; el.style.overflowY="auto";
        var srcShort = (src||"").split("/").pop();
        var stack = err&&err.stack ? err.stack.substring(0,300) : "";
        el.innerHTML = '<div style="padding:24px;width:100%;max-width:400px;">'
          + '<div style="font-size:36px;text-align:center;margin-bottom:12px;">⚠️</div>'
          + '<div style="color:#FF5C3A;font-size:15px;font-weight:700;margin-bottom:10px;text-align:center;">Erreur de chargement</div>'
          + '<div style="background:#1C1F23;border:1px solid rgba(255,92,58,0.3);border-radius:10px;padding:12px;margin-bottom:10px;">'
          + '<div style="color:#F7F8F9;font-size:12px;font-weight:600;margin-bottom:4px;">Message :</div>'
          + '<div style="color:#9CA3AF;font-size:11px;word-break:break-all;line-height:1.5;">' + msg + '</div>'
          + '</div>'
          + (srcShort ? '<div style="background:#1C1F23;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;margin-bottom:10px;">'
          + '<div style="color:#F7F8F9;font-size:12px;font-weight:600;margin-bottom:4px;">Fichier · Ligne :</div>'
          + '<div style="color:#9CA3AF;font-size:11px;">' + srcShort + ' · ligne ' + line + '</div>'
          + '</div>' : '')
          + (stack ? '<div style="background:#1C1F23;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;margin-bottom:10px;">'
          + '<div style="color:#F7F8F9;font-size:12px;font-weight:600;margin-bottom:4px;">Stack :</div>'
          + '<div style="color:#6B7280;font-size:10px;word-break:break-all;line-height:1.5;white-space:pre-wrap;">' + stack + '</div>'
          + '</div>' : '')
          + '<div style="color:#6B7280;font-size:11px;text-align:center;">Copie ce message et envoie-le à IOK support</div>'
          + '</div>';
      }
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.onerror('Promise rejetée: ' + (e.reason||e), '', 0, 0, e.reason instanceof Error ? e.reason : null);
    });
  </script>

/* ══ LOGO IOK SVG ════════════════════════════════════════════
   Fond rouge #F40000 + éclair vert électrique #39FF14
   size: "sm" (32px) | "md" (48px) | "lg" (80px)
══════════════════════════════════════════════════════════════ */
function IOKLogo({size="md", style={}}){
  const dims = {sm:32, md:48, lg:80};
  const radii = {sm:9,  md:14, lg:22};
  const s = dims[size]||48;
  const r = radii[size]||14;
  // Éclair centré dans le carré, proportionnel
  const p = s * 0.18;  // padding
  const pts = [
    [s*0.58, p],
    [s*0.32, s*0.52],
    [s*0.52, s*0.52],
    [s*0.42, s-p],
    [s*0.72, s*0.46],
    [s*0.52, s*0.46],
  ];
  const d = `M${pts[0][0]},${pts[0][1]} L${pts[1][0]},${pts[1][1]} L${pts[2][0]},${pts[2][1]} L${pts[3][0]},${pts[3][1]} L${pts[4][0]},${pts[4][1]} L${pts[5][0]},${pts[5][1]} Z`;
  return(
    <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`} style={{flexShrink:0,display:"block",...style}}>
      <rect width={s} height={s} rx={r} fill="#F40000"/>
      <path d={d} fill="#39FF14" stroke="#39FF14" strokeWidth={s*0.02} strokeLinejoin="round"/>
    </svg>
  );
}

  const editMarkerRef=useRef(null);
  const cityObj=CITIES.find(c=>c.id===city)||CITIES[0];

  const buildIcon=(r,isSel)=>{
    const ok=r.disponible&&r.disponible_jusqu&&new Date(r.disponible_jusqu)>new Date();
    const color=ok?"#22c55e":"#6b7280";
    const size=isSel?30:22;
    return window.L.divIcon({
      html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:${isSel?3:2}px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:${isSel?13:10}px;">${r.image_emoji||"🍽️"}</div>`,
      className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
    });
  };

  useEffect(()=>{
    if(!mapRef.current||instanceRef.current) return;
    const L=window.L;
    const initLat=editMode&&editLat?editLat:cityObj.lat;
    const initLng=editMode&&editLng?editLng:cityObj.lng;
    const initZoom=editMode&&editLat?17:cityObj.zoom;
    const map=L.map(mapRef.current,{center:[initLat,initLng],zoom:initZoom,zoomControl:true,attributionControl:true});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    if(!editMode) L.marker([cityObj.lat,cityObj.lng],{icon:L.divIcon({html:`<div style="width:18px;height:18px;border-radius:50%;background:#3b82f6;border:3px solid white;box-shadow:0 0 0 6px rgba(59,130,246,0.25);"></div>`,className:"",iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map).bindPopup("📍 Vous êtes ici",{className:"iok-popup"});
    // Mode édition
    if(editMode){
      const em=L.marker([editLat||cityObj.lat,editLng||cityObj.lng],{
        icon:L.divIcon({html:`<div style="width:32px;height:32px;border-radius:50%;background:#FF5C3A;border:3px solid white;box-shadow:0 0 0 6px rgba(255,92,58,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;">📍</div>`,className:"",iconSize:[32,32],iconAnchor:[16,16]}),
        draggable:true,
      });
      em.addTo(map);
      em.on("dragend",()=>{const p=em.getLatLng();if(onEditMove)onEditMove(p.lat,p.lng);});
      map.on("click",e=>{em.setLatLng(e.latlng);if(onEditMove)onEditMove(e.latlng.lat,e.latlng.lng);});
      editMarkerRef.current=em;
      if(editLat&&editLng) map.setView([editLat,editLng],16);
    }
    instanceRef.current=map;
    setTimeout(()=>map.invalidateSize(),200);
    return()=>{map.remove();instanceRef.current=null;};
  },[]);

  useEffect(()=>{if(instanceRef.current)instanceRef.current.setView([cityObj.lat,cityObj.lng],cityObj.zoom);},[city]);

  useEffect(()=>{
    const map=instanceRef.current;
    if(!map||!window.L||editMode) return;
    markersRef.current.forEach(m=>map.removeLayer(m));
    markersRef.current=[];
    (restaurants||[]).forEach(r=>{
      if(!r.latitude||!r.longitude) return;
      const isSel=selected?.id===r.id;
      const ok=r.disponible&&r.disponible_jusqu&&new Date(r.disponible_jusqu)>new Date();
      const m=window.L.marker([r.latitude,r.longitude],{icon:buildIcon(r,isSel)});
      m.addTo(map);
      const tLeft=ok?Math.max(0,new Date(r.disponible_jusqu)-new Date()):0;
      const timeStr=ok?`<span style="color:#4ade80;font-weight:700;">${fmt(tLeft)} restant</span>`:`<span style="color:#6b7280;">Indisponible</span>`;
      m.bindPopup(`<div><b style="font-size:14px;">${r.image_emoji} ${r.nom}</b><br/><span style="color:#9CA3AF;font-size:11px;">${r.cuisines?r.cuisines.join(", "):""} · ~${r.prix_moyen||"?"}€</span><br/>${timeStr}</div>`,{className:"iok-popup",maxWidth:200});
      m.on("click",()=>{if(onSelect)onSelect(r);});
      markersRef.current.push(m);
    });
  },[restaurants,selected]);

  useEffect(()=>{if(editMarkerRef.current&&editLat&&editLng)editMarkerRef.current.setLatLng([editLat,editLng]);},[editLat,editLng]);

  return(
    <div style={{borderRadius:20,overflow:"hidden",border:`1px solid ${C.border}`,marginBottom:14}}>
      <div ref={mapRef} style={{height,width:"100%",display:"block"}}/>
      {!editMode&&(
        <div style={{padding:"8px 14px",background:"#0f1520",borderTop:`1px solid ${C.border}`}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"6px 16px"}}>
            {[["#22c55e","Disponible — abonné"],["#ef4444","Indisponible — abonné"],["#9ca3af","Non inscrit IOK"],["#3b82f6","Vous"]].map(([c,l])=>(
              <span key={l} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:C.muted}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:c,display:"inline-block",flexShrink:0}}/>
                {l}
              </span>
            ))}
          </div>
        </div>
      )}
      {editMode&&<div style={{padding:"10px 14px",background:"#0f1520",borderTop:`1px solid ${C.border}`,color:C.muted,fontSize:12}}>📍 Appuyez sur la carte ou faites glisser le marqueur</div>}
    </div>
  );
}

function RestaurateurLogin({onSuccess,onRegister,onBack,onHome}){
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [showPwd,setShowPwd]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const login=async()=>{
    setError("");setLoading(true);
    try{
      // 1. Récupère le restaurateur par username
      const {data:rt,error:e1}=await db().from("restaurateurs")
        .select("*")
        .eq("username",username.trim())
        .single();
      if(e1||!rt){setError("Identifiant introuvable.");setLoading(false);return;}

      // 2. Vérification mot de passe directement en base (password_hash)
      // En production : utiliser Supabase Auth
      // En test : vérification directe du champ password_hash
      if(rt.password_hash !== password){
        setError("Mot de passe incorrect.");
        setLoading(false);
        return;
      }

      // 3. Tentative connexion Supabase Auth (optionnelle — si compte Auth existe)
      // Ne bloque pas si le compte Auth n'existe pas encore
      try{
        await db().auth.signInWithPassword({email:rt.email, password});
      }catch(authErr){
        console.log("Auth optionnelle non disponible:", authErr.message);
      }

      // 4. Charge ses restaurants
      const {data:rests}=await db().from("restaurants")
        .select("*")
        .eq("restaurateur_id",rt.id)
        .eq("actif",true)
        .order("created_at");

      onSuccess({...rt, restaurants:rests||[]});
    }catch(err){
      setError("Erreur de connexion. Vérifiez votre réseau.");
    }finally{setLoading(false);}
  };

  return(
    <PageShell onBack={onBack} backLabel="Accueil" onHome={onHome} topSlot={<BrandBar subtitle="Espace Restaurateur"/>}>
      <div style={{paddingTop:8}}>
        <div style={{marginBottom:24}}>
          <div style={{color:C.text,fontSize:24,fontWeight:900,marginBottom:4}}>Connexion</div>
          <div style={{color:C.muted,fontSize:13}}>Accédez à votre tableau de bord</div>
        </div>
        <FInput label="Identifiant" value={username} onChange={setUsername} placeholder="Votre nom d'utilisateur"/>
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Mot de passe</div>
          <div style={{display:"flex",alignItems:"center",background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
            <input type={showPwd?"text":"password"} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&username&&password&&login()} placeholder="••••••••"
              style={{flex:1,background:"transparent",border:"none",outline:"none",padding:"14px",color:C.text,fontSize:15,fontFamily:"inherit"}}/>
            <button onClick={()=>setShowPwd(v=>!v)} style={{padding:"0 14px",background:"transparent",border:"none",color:C.muted,cursor:"pointer",fontSize:16}}>{showPwd?"🙈":"👁️"}</button>
          </div>
        </div>
        {error&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:C.red,fontSize:13}}>⚠️ {error}</div>}
        <Btn onClick={login} disabled={!username.trim()||!password} loading={loading}>{loading?"Connexion…":"Se connecter"}</Btn>
        <div style={{height:1,background:C.border,margin:"24px 0"}}/>
        <div style={{textAlign:"center",marginBottom:12,color:C.sub,fontSize:13}}>Pas encore de compte ?</div>
        <Btn variant="outline" onClick={onRegister}>Créer mon compte restaurateur</Btn>
      </div>
    </PageShell>
  );
}

            {b==="monthly"?"Mensuel":"Annuel · -15%"}

            {p.popular&&!p.tag&&<div style={{position:"absolute",top:-1,right:14,background:p.id==="premium"?"#a855f7":C.accent,color:"white",fontSize:10,fontWeight:800,padding:"3px 10px",borderRadius:"0 0 8px 8px"}}>POPULAIRE</div>}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <div style={{color:planColor,fontWeight:800,fontSize:16}}>{p.name}</div>
                <div style={{color:C.muted,fontSize:12}}>{p.desc}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{color:plan===p.id?planColor:C.text,fontSize:22,fontWeight:900}}>
                  {p.price===0?"Gratuit":`${monthlyPrice}€`}
                </div>
                {p.price>0&&<div style={{color:C.muted,fontSize:11}}>/mois</div>}
                {p.price>0&&billing==="yearly"&&p.priceYear&&(
                  <div style={{color:"#22c55e",fontSize:10,fontWeight:600}}>{p.priceYear}€/an</div>
                )}
                {p.trialDays&&<div style={{color:"#22c55e",fontSize:11,fontWeight:600}}>{p.trialDays} jours offerts</div>}
              </div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"4px 14px"}}>
              {p.features.map(f=>(
                <div key={f} style={{display:"flex",alignItems:"center",gap:4}}>
                  <span style={{color:"#22c55e",fontSize:11}}>✓</span>
                  <span style={{color:C.sub,fontSize:12}}>{f}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </>
  );
}

function RestaurateurAuth({onSuccess,onBackToLogin,onHome}){
  const STEPS=["Compte","Formule","Activation","Restaurants"];
  const [step,setStep]=useState("account");
  const [account,setAccount]=useState({responsable:"",email:"",tel:"",username:"",password:"",confirm:""});
  const [plan,setPlan]=useState("trial");
  const [restaurants,setRestaurants]=useState([]);
  const [editingResto,setEditingResto]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [showPwd,setShowPwd]=useState(false);
  const [card,setCard]=useState({num:"",exp:"",cvc:"",holder:""});

  const isTrial=plan==="trial";
  const stepIdx=step==="account"?0:step==="plan"?1:step==="payment"?2:3;
  const prevStep=()=>{if(step==="plan")setStep("account");else if(step==="restaurants")setStep("plan");else if(step==="payment")setStep("restaurants");};
  const fmtCard=v=>v.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim();
  const fmtExp=v=>{const d=v.replace(/\D/g,"").slice(0,4);return d.length>2?d.slice(0,2)+"/"+d.slice(2):d;};
  const validAccount=account.responsable&&account.email&&account.username.trim().length>=3&&account.password.length>=6&&account.password===account.confirm;
  const validCard=card.num.replace(/\s/g,"").length===16&&card.exp.length===5&&card.cvc.length===3&&card.holder;

  const finish=async()=>{
    setError("");setLoading(true);
    try{
      // Vérifie username non dupliqué
      const {data:existingUser}=await db().from("restaurateurs").select("id").eq("username",account.username.trim()).maybeSingle();
      if(existingUser) throw new Error("Ce nom d'utilisateur est déjà pris.");

      // Vérifie email non dupliqué
      const {data:existingEmail}=await db().from("restaurateurs").select("id").eq("email",account.email.trim().toLowerCase()).maybeSingle();
      if(existingEmail) throw new Error("Cet email est déjà utilisé. Connectez-vous ou utilisez un autre email.");

      // 1. Créer le compte Supabase Auth
      const {data:authData,error:authErr}=await db().auth.signUp({
        email:account.email.trim().toLowerCase(),
        password:account.password,
        options:{data:{type:"restaurateur",username:account.username.trim(),responsable:account.responsable}}
      });
      if(authErr){
        if(authErr.message.toLowerCase().includes("already")){
          throw new Error("Cet email est déjà enregistré. Veuillez vous connecter.");
        }
        throw new Error(authErr.message);
      }

      // 2. Créer le restaurateur
      const planFin=isTrial?new Date(Date.now()+30*24*60*60*1000).toISOString():null;
      const {data:rt,error:rtErr}=await db().from("restaurateurs").insert({
        auth_user_id:authData.user?.id,
        responsable:account.responsable.trim(),
        email:account.email.trim().toLowerCase(),
        telephone:account.tel||null,
        username:account.username.trim(),
        password_hash:"managed_by_supabase_auth",
        plan, plan_debut:new Date().toISOString(), plan_fin:planFin, actif:true,
      }).select().single();
      if(rtErr) throw new Error("Erreur création compte : "+rtErr.message);

      // 3. Créer les restaurants (si ajoutés à cette étape)
      let savedRestaurants=[];
      if(restaurants.length>0){
        const rows=restaurants.map(r=>({
          restaurateur_id:rt.id, nom:r.nom, siret:r.siret||null,
          adresse:r.adresse, ville:r.ville, cuisines:r.cuisines,
          image_emoji:r.image||"🍽️", latitude:r.lat||null, longitude:r.lng||null,
          prix_moyen:r.prix_moyen||null, nb_tables_2:0, nb_tables_4:0,
          disponible:false, actif:true,
        }));
        const {data:saved,error:restoErr}=await db().from("restaurants").insert(rows).select();
        if(restoErr) throw new Error("Erreur création restaurant : "+restoErr.message);
        savedRestaurants=saved||[];
      }

      setStep("done");
      setTimeout(()=>onSuccess({...rt,restaurants:savedRestaurants}),1400);
    }catch(err){
      setError(err.message||"Erreur lors de la création du compte.");
      window.scrollTo(0,0);
    }finally{setLoading(false);}
  }

  if(step==="done") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,padding:32}}>
      <div style={{fontSize:64}}>🎉</div>
      <div style={{color:C.text,fontSize:24,fontWeight:900,textAlign:"center"}}>Compte créé !</div>
      <div style={{color:C.muted,fontSize:14,textAlign:"center",lineHeight:1.6}}>
        Bienvenue sur IOK. Vous pouvez maintenant ajouter vos restaurants depuis votre tableau de bord.
      </div>
      <div style={{background:isTrial?C.greenSoft:C.accentSoft,border:`1px solid ${isTrial?C.green:C.accent}`,borderRadius:14,padding:"12px 24px",color:isTrial?C.green:C.accent,fontSize:14,fontWeight:700}}>
        {isTrial?"🎁 Essai gratuit 30 jours activé !":"✓ Plan "+PLANS.find(p=>p.id===plan)?.name+" activé"}
      </div>
    </div>
  );

  if(editingResto!==null) return(
    <EditRestaurant
      resto={editingResto}
      onSave={r=>{
        if(r.id) setRestaurants(rs=>rs.map(x=>x.id===r.id?r:x));
        else setRestaurants(rs=>[...rs,{...r,id:"tmp_"+Date.now()}]);
        setEditingResto(null);
      }}
      onCancel={()=>setEditingResto(null)}
    />
  );

  return(
    <PageShell onBack={step==="account"?onBackToLogin:prevStep} backLabel={step==="account"?"← Connexion":"← Étape précédente"} onHome={onHome} topSlot={<><BrandBar subtitle="Créer un compte"/><StepBar steps={STEPS} current={STEPS[stepIdx]}/></>}>
      <div style={{paddingTop:16}}>

        {/* COMPTE */}
        {step==="account"&&<>
          <div style={{color:C.text,fontSize:21,fontWeight:800,marginBottom:2}}>Vos informations</div>
          <div style={{color:C.muted,fontSize:13,marginBottom:18}}>Compte gestionnaire pour tous vos restaurants</div>
          <FInput label="Nom du responsable" required={true} value={account.responsable} onChange={v=>setAccount(p=>({...p,responsable:v}))} placeholder="Prénom Nom"/>
          <FInput label="Email" required={true} type="email" value={account.email} onChange={v=>setAccount(p=>({...p,email:v}))} placeholder="contact@monresto.fr"/>
          <FInput label="Téléphone" type="tel" value={account.tel} onChange={v=>setAccount(p=>({...p,tel:v}))} placeholder="04 50 12 34 56"/>
          <FInput label="Nom d'utilisateur" required={true} value={account.username} onChange={v=>setAccount(p=>({...p,username:v}))} placeholder="ex: Richard" hint="Minimum 3 caractères"/>
          <div style={{marginBottom:14}}>
            <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Mot de passe</div>
            <div style={{display:"flex",alignItems:"center",background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
              <input type={showPwd?"text":"password"} value={account.password} onChange={e=>setAccount(p=>({...p,password:e.target.value}))} placeholder="Minimum 6 caractères" title="Le mot de passe doit contenir au moins 6 caractères"
                style={{flex:1,background:"transparent",border:"none",outline:"none",padding:"14px",color:C.text,fontSize:15,fontFamily:"inherit"}}/>
              <button onClick={()=>setShowPwd(v=>!v)} style={{padding:"0 14px",background:"transparent",border:"none",color:C.muted,cursor:"pointer",fontSize:16}}>{showPwd?"🙈":"👁️"}</button>
            </div>
            <div style={{color:"#eab308",fontSize:11,marginTop:4}}>⚠️ Minimum 6 caractères requis</div>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Confirmer</div>
            <div style={{background:C.card,border:`1px solid ${account.confirm&&account.confirm!==account.password?"rgba(239,68,68,0.5)":C.border}`,borderRadius:12,overflow:"hidden"}}>
              <input type="password" value={account.confirm} onChange={e=>setAccount(p=>({...p,confirm:e.target.value}))} placeholder="Répéter le mot de passe"
                style={{width:"100%",background:"transparent",border:"none",outline:"none",padding:"14px",color:C.text,fontSize:15,fontFamily:"inherit"}}/>
            </div>
            {account.confirm&&account.confirm!==account.password&&<div style={{color:C.red,fontSize:11,marginTop:4}}>Les mots de passe ne correspondent pas</div>}
            {account.confirm&&account.confirm===account.password&&account.password.length>=6&&<div style={{color:C.green,fontSize:11,marginTop:4}}>✓ Identiques</div>}
          </div>
          <Btn onClick={()=>setStep("plan")} disabled={!validAccount}>Suivant : formule →</Btn>

        {step==="plan"&&<>
          <div style={{color:C.text,fontSize:21,fontWeight:800,marginBottom:2}}>Votre formule</div>
          <div style={{color:C.muted,fontSize:13,marginBottom:18}}>Commencez gratuitement</div>
          
          <PlanSelector plan={plan} setPlan={setPlan}/>
          <Btn onClick={()=>setStep("payment")}>Suivant : activation →</Btn>

              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>setEditingResto(r)} style={{background:"rgba(255,255,255,0.07)",border:"none",color:C.sub,padding:"6px 10px",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>✏️</button>
                <button onClick={()=>setRestaurants(rs=>rs.filter(x=>x.id!==r.id))} style={{background:"rgba(239,68,68,0.1)",border:"none",color:C.red,padding:"6px 10px",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>✕</button>
              </div>
            </div>
          ))}
          {restaurants.length===0&&(
            <div style={{background:C.card,border:`1px dashed ${C.border}`,borderRadius:14,padding:"24px 16px",marginBottom:16,textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:8}}>🏪</div>
              <div style={{color:C.muted,fontSize:13}}>Aucun restaurant ajouté</div>
            </div>
          )}
          <button onClick={()=>setEditingResto({nom:"",siret:"",adresse:"",ville:"Annecy",cuisines:[],image:"🍽️",lat:null,lng:null,tables2:4,tables4:3,prix_moyen:30})} style={{width:"100%",padding:"14px 0",borderRadius:14,border:`2px dashed ${C.accent}`,background:"transparent",color:C.accent,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:16}}>
            + Ajouter un restaurant
          </button>
          {error&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:C.red,fontSize:13}}>⚠️ {error}</div>}
          <Btn onClick={()=>setStep("payment")} disabled={restaurants.length===0}>Suivant : activation →</Btn>
        </>}

        {/* PAIEMENT / ACTIVATION */}
        {step==="payment"&&<>
          {isTrial?<>
            <div style={{color:C.text,fontSize:21,fontWeight:800,marginBottom:2}}>Activation gratuite</div>
            <div style={{background:C.greenSoft,border:`1px solid rgba(34,197,94,0.4)`,borderRadius:20,padding:24,marginBottom:22,textAlign:"center",marginTop:18}}>
              <div style={{fontSize:52,marginBottom:12}}>🎁</div>
              <div style={{color:C.green,fontWeight:800,fontSize:20,marginBottom:6}}>1 mois offert</div>
              <div style={{color:C.text,fontWeight:700,fontSize:16,marginBottom:4}}>{restaurants.length} restaurant{restaurants.length>1?"s":""}</div>
              <div style={{color:C.muted,fontSize:13}}>Sans CB · 30 jours</div>
            </div>
            {["Aucune CB requise","Accès immédiat","Résiliation en 1 clic","Rappel avant la fin d'essai"].map(f=><div key={f} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><span style={{color:C.green}}>✓</span><span style={{color:C.sub,fontSize:13}}>{f}</span></div>)}
            {error&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:C.red,fontSize:13}}>⚠️ {error}</div>}
            <div style={{height:12}}/>
            <Btn variant="green" onClick={finish} loading={loading}>{loading?"Création du compte…":"Créer mon compte 🚀"}</Btn>
          </>:<>
            <div style={{color:C.text,fontSize:21,fontWeight:800,marginBottom:18}}>Paiement</div>
            <div style={{background:C.accentSoft,border:`1px solid rgba(255,92,58,0.25)`,borderRadius:12,padding:14,marginBottom:18}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{color:C.text,fontWeight:700}}>{PLANS.find(p=>p.id===plan)?.name}</div><div style={{color:C.accent,fontSize:13}}>{restaurants.length} restaurant{restaurants.length>1?"s":""}</div></div>
                <div style={{color:C.text,fontSize:22,fontWeight:900}}>{PLANS.find(p=>p.id===plan)?.price}€<span style={{fontSize:12,color:C.muted}}>/mois</span></div>
              </div>
            </div>
            <div style={{background:"linear-gradient(135deg,#1C2440,#252B40)",borderRadius:18,padding:18,marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:20}}><div style={{width:34,height:26,borderRadius:4,background:"linear-gradient(135deg,#FFD700,#FFA500)"}}/><span style={{color:"rgba(255,255,255,0.35)"}}>VISA</span></div>
              <div style={{color:"rgba(255,255,255,0.9)",fontFamily:"monospace",letterSpacing:2,marginBottom:14}}>{card.num||"•••• •••• •••• ••••"}</div>
              <div style={{display:"flex",justifyContent:"space-between"}}><div><div style={{color:"rgba(255,255,255,0.35)",fontSize:8}}>TITULAIRE</div><div style={{color:"rgba(255,255,255,0.8)",fontSize:12,fontWeight:600}}>{card.holder||"VOTRE NOM"}</div></div><div><div style={{color:"rgba(255,255,255,0.35)",fontSize:8}}>EXPIRY</div><div style={{color:"rgba(255,255,255,0.8)",fontSize:12,fontWeight:600}}>{card.exp||"MM/YY"}</div></div></div>
            </div>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,marginBottom:16}}>
              <div style={{marginBottom:12}}><div style={{color:C.sub,fontSize:10,textTransform:"uppercase",marginBottom:6}}>Numéro</div><input value={card.num} onChange={e=>setCard(p=>({...p,num:fmtCard(e.target.value)}))} placeholder="1234 5678 9012 3456" maxLength={19} style={{width:"100%",background:"transparent",border:"none",outline:"none",color:C.text,fontSize:15,fontFamily:"monospace",letterSpacing:2,padding:0,boxSizing:"border-box"}}/></div>
              <div style={{height:1,background:C.border,margin:"0 0 12px"}}/>
              <div style={{display:"flex",gap:16}}>
                <div style={{flex:1}}><div style={{color:C.sub,fontSize:10,textTransform:"uppercase",marginBottom:6}}>Expiration</div><input value={card.exp} onChange={e=>setCard(p=>({...p,exp:fmtExp(e.target.value)}))} placeholder="MM/YY" maxLength={5} style={{width:"100%",background:"transparent",border:"none",outline:"none",color:C.text,fontSize:15,fontFamily:"monospace",padding:0}}/></div>
                <div style={{flex:1}}><div style={{color:C.sub,fontSize:10,textTransform:"uppercase",marginBottom:6}}>CVC</div><input value={card.cvc} onChange={e=>setCard(p=>({...p,cvc:e.target.value.replace(/\D/g,"").slice(0,3)}))} placeholder="•••" maxLength={3} type="password" style={{width:"100%",background:"transparent",border:"none",outline:"none",color:C.text,fontSize:15,fontFamily:"monospace",padding:0}}/></div>
              </div>
              <div style={{height:1,background:C.border,margin:"12px 0"}}/>
              <div><div style={{color:C.sub,fontSize:10,textTransform:"uppercase",marginBottom:6}}>Titulaire</div><input value={card.holder} onChange={e=>setCard(p=>({...p,holder:e.target.value.toUpperCase()}))} placeholder="NOM PRÉNOM" style={{width:"100%",background:"transparent",border:"none",outline:"none",color:C.text,fontSize:14,fontFamily:"monospace",padding:0}}/></div>
            </div>
            {error&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:C.red,fontSize:13}}>⚠️ {error}</div>}
            <Btn onClick={finish} disabled={!validCard} loading={loading}>{loading?"Traitement…":`Payer ${PLANS.find(p=>p.id===plan)?.price}€`}</Btn>
          </>}
        </>}
      </div>
    </PageShell>
  );
}

/* ══ EDIT RESTAURANT ════════════════════════════════ */
function EditRestaurant({resto,onSave,onCancel}){
  const [form,setForm]=useState({nom:resto.nom||"",siret:resto.siret||"",adresse:resto.adresse||"",ville:resto.ville||"Annecy",cuisines:resto.cuisines||[],image:resto.image||"🍽️",lat:resto.lat||null,lng:resto.lng||null,prix_moyen:resto.prix_moyen||30,id:resto.id||null});
  const [locStep,setLocStep]=useState("form");
  const [locating,setLocating]=useState(false);
  const ff=(k,v)=>setForm(p=>({...p,[k]:v}));
  const toggleC=c=>setForm(p=>({...p,cuisines:p.cuisines.includes(c)?p.cuisines.filter(x=>x!==c):[...p.cuisines,c]}));
  const fmtSiret=v=>v.replace(/\D/g,"").slice(0,14).replace(/(.{3})(.{3})(.{3})(.{5})/,"$1 $2 $3 $4").trim();
  const validForm=form.nom&&form.adresse&&form.ville&&form.cuisines.length>0;

  const geolocate=()=>{
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      pos=>{ff("lat",pos.coords.latitude);ff("lng",pos.coords.longitude);setLocating(false);setLocStep("map");},
      ()=>{setLocating(false);setLocStep("map");},
      {enableHighAccuracy:true,timeout:8000}
    );
  };

  if(locStep==="map") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
      <div style={{padding:"52px 20px 12px",background:`linear-gradient(180deg,rgba(255,92,58,0.07),transparent)`}}>
        <BackBtn onBack={()=>setLocStep("form")} label="← Retour"/>
        <BrandBar subtitle="Localiser le restaurant"/>
      </div>
      <div style={{padding:"0 16px 16px",flex:1,display:"flex",flexDirection:"column"}}>
        <div style={{color:C.muted,fontSize:13,marginBottom:12}}>Appuyez sur la carte ou faites glisser le marqueur 📍</div>
        <LeafletMapEdit restaurants={[]} selected={null} city="annecy" height={320} editMode={true} editLat={form.lat||45.8992} editLng={form.lng||6.1294} onEditMove={(lat,lng)=>{ff("lat",lat);ff("lng",lng);}}/>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 14px",marginBottom:16,fontSize:12,color:C.muted}}>
          Position : <strong style={{color:C.text}}>{form.lat?.toFixed(5)}, {form.lng?.toFixed(5)}</strong>
        </div>
        <Btn variant="green" onClick={()=>setLocStep("confirmed")}>✓ Confirmer cette localisation</Btn>
      </div>
    </div>
  );

  if(locStep==="confirmed") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:14,padding:32,textAlign:"center"}}>
      <div style={{fontSize:60}}>📍</div>
      <div style={{color:C.green,fontSize:18,fontWeight:800}}>Position confirmée !</div>
      <div style={{color:C.text,fontSize:14}}>{form.nom||"Restaurant"}</div>
      <div style={{color:C.muted,fontSize:13}}>{form.lat?.toFixed(5)}, {form.lng?.toFixed(5)}</div>
      <div style={{height:16}}/>
      <Btn onClick={()=>onSave(form)}>Enregistrer le restaurant →</Btn>
      <div style={{height:8}}/>
      <Btn variant="outline" onClick={()=>setLocStep("map")}>← Modifier la position</Btn>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
      <div style={{padding:"52px 20px 12px",background:`linear-gradient(180deg,rgba(255,92,58,0.07),transparent)`}}>
        <BackBtn onBack={onCancel} label="← Annuler"/>
        <BrandBar subtitle={form.id?"Modifier":"Nouveau restaurant"}/>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"4px 16px 40px"}}>
        <div style={{marginBottom:16}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Icône</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{EMOJIS.map(e=><button key={e} onClick={()=>ff("image",e)} style={{width:40,height:40,borderRadius:10,border:`2px solid ${form.image===e?C.accent:C.border}`,background:form.image===e?C.accentSoft:"transparent",fontSize:20,cursor:"pointer"}}>{e}</button>)}</div>
        </div>
        <FInput label="Nom du restaurant" required={true} value={form.nom} onChange={v=>ff("nom",v)} placeholder="MAESTO"/>
        <FInput label="SIRET (optionnel)" value={form.siret} onChange={v=>ff("siret",fmtSiret(v))} placeholder="412 856 974 00028" maxLength={17}/>
        <FInput label="Adresse" required={true} value={form.adresse} onChange={v=>ff("adresse",v)} placeholder="3 rue Filaterie"/>
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Ville</div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
            <select value={form.ville} onChange={e=>ff("ville",e.target.value)} style={{width:"100%",background:"transparent",border:"none",outline:"none",padding:"14px",color:C.text,fontSize:15,fontFamily:"inherit",cursor:"pointer"}}>
              {CITIES.map(c=><option key={c.id} value={c.name} style={{background:C.card}}>{c.name}</option>)}
            </select>
          </div>
        </div>
        <FInput label="Prix moyen (€/pers)" type="number" value={form.prix_moyen} onChange={v=>ff("prix_moyen",+v)} placeholder="30"/>
        <div style={{marginBottom:20}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Type(s) de cuisine <span style={{color:C.red}}>*</span></div>
          <div style={{display:"flex",flexWrap:"wrap"}}>{CUISINES.map(c=><FBadge key={c} label={c} active={form.cuisines.includes(c)} onClick={()=>toggleC(c)}/>)}</div>
          {form.cuisines.length>0&&<div style={{color:C.muted,fontSize:11,marginTop:8}}>✓ {form.cuisines.length} sélectionné{form.cuisines.length>1?"s":""}</div>}
        </div>
        <div style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 14px",marginBottom:20,display:"flex",gap:10}}>
          <span style={{fontSize:16}}>ℹ️</span>
          <div style={{color:C.muted,fontSize:12,lineHeight:1.5}}>Le nombre de tables disponibles se configure depuis le tableau de bord, après la création du restaurant.</div>
        </div>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:16,marginBottom:20}}>
          <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:4}}>📍 Localisation</div>
          <div style={{color:form.lat&&form.lng?C.green:C.muted,fontSize:12,marginBottom:12}}>
            {form.lat&&form.lng?`✓ Position définie (${form.lat.toFixed(4)}, ${form.lng.toFixed(4)})`:"Non définie — vos clients ne pourront pas vous trouver sur la carte"}
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={geolocate} disabled={locating} style={{flex:1,padding:"10px 0",borderRadius:12,border:`1px solid ${C.border}`,background:"rgba(59,130,246,0.1)",color:"#60a5fa",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              {locating?"⏳ Localisation…":"📡 Me géolocaliser"}
            </button>
            <button onClick={()=>setLocStep("map")} style={{flex:1,padding:"10px 0",borderRadius:12,border:`1px solid ${C.border}`,background:C.accentSoft,color:C.accent,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              🗺️ Placer sur carte
            </button>
          </div>
        </div>
        <Btn onClick={()=>validForm&&(form.lat&&form.lng?onSave(form):setLocStep("map"))} disabled={!validForm}>
          {form.lat&&form.lng?"Enregistrer ✓":"Suivant : localiser →"}
        </Btn>
        <div style={{height:10}}/>
        <Btn variant="outline" onClick={onCancel}>Annuler</Btn>
      </div>
    </div>
  );
}

/* ══ RESTO APP (dashboard) ══════════════════════════ */
function RestaurateurApp({user,onLogout,onHome}){
  const [restaurants,setRestaurants]=useState(user.restaurants||[]);
  const [activeId,setActiveId]=useState(user.restaurants?.[0]?.id||null);
  const [timeLeft,setTimeLeft]=useState(0);
  const [view,setView]=useState("dashboard"); // dashboard | select | add | reservations
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState(null);
  const timerRef=useRef(null);

  const active=restaurants.find(r=>r.id===activeId)||restaurants[0];
  const planInfo=PLANS.find(p=>p.id===user.plan)||PLANS[2];

  // Timer local
  useEffect(()=>{
    if(active?.disponible&&active?.disponible_jusqu){
      const up=()=>{
        const l=new Date(active.disponible_jusqu)-new Date();
        if(l<=0){setTimeLeft(0);updateDispoLocal({disponible:false,disponible_jusqu:null});}
        else setTimeLeft(l);
      };
      up();timerRef.current=setInterval(up,1000);
    }else setTimeLeft(0);
    return()=>clearInterval(timerRef.current);
  },[active?.disponible,active?.disponible_jusqu]);

  const updateDispoLocal=(patch)=>setRestaurants(rs=>rs.map(r=>r.id===active?.id?{...r,...patch}:r));

  const toggle=async()=>{
    setSaving(true);
    try{
      if(active?.disponible){
        await db().from("restaurants").update({disponible:false,disponible_depuis:null,disponible_jusqu:null,grande_disponibilite:false,updated_at:new Date().toISOString()}).eq("id",active.id);
        updateDispoLocal({disponible:false,disponible_depuis:null,disponible_jusqu:null,grande_disponibilite:false});
        setToast({message:"Restaurant masqué des clients",type:"warning"});
      }else{
        const now=new Date();
        const exp=new Date(now.getTime()+30*60*1000);
        await db().from("restaurants").update({disponible:true,disponible_depuis:now.toISOString(),disponible_jusqu:exp.toISOString(),updated_at:now.toISOString()}).eq("id",active.id);
        updateDispoLocal({disponible:true,disponible_depuis:now.toISOString(),disponible_jusqu:exp.toISOString()});
        setToast({message:"Restaurant visible pendant 30 minutes !",type:"success"});
      }
    }catch(e){setToast({message:"Erreur réseau",type:"error"});}
    finally{setSaving(false);}
  };

  const togglePromo=async()=>{
    const durée = window.IOK_PARAMS.duree_promo_min||30;
    if(active?.promo_active){
      updateDispoLocal({promo_active:false, promo_jusqu:null});
      await db().from("restaurants").update({promo_active:false, promo_jusqu:null, updated_at:new Date().toISOString()}).eq("id",active.id);
      setToast({message:"PromoFlash désactivée",type:"warning"});
    } else {
      const exp = new Date(Date.now()+durée*60*1000);
      updateDispoLocal({promo_active:true, promo_jusqu:exp.toISOString()});
      await db().from("restaurants").update({promo_active:true, promo_jusqu:exp.toISOString(), promo_pct:active.promo_pct||10, updated_at:new Date().toISOString()}).eq("id",active.id);
      setToast({message:`⭐ PromoFlash ${active.promo_pct||10}% activée !`,type:"success"});
    }
  };

  const updateTables=async(key,val)=>{
    updateDispoLocal({[key]:val});
    await db().from("restaurants").update({[key]:val,updated_at:new Date().toISOString()}).eq("id",active.id);
  };

  const toggleGrandeDispo=async()=>{
    const val=!active?.grande_disponibilite;
    updateDispoLocal({grande_disponibilite:val});
    await db().from("restaurants").update({grande_disponibilite:val,updated_at:new Date().toISOString()}).eq("id",active.id);
  };

  const progress=active?.disponible&&active?.disponible_jusqu?(timeLeft/(30*60*1000))*100:0;

  if(view==="select") return(
    <PageShell onBack={()=>restaurants.length>0?setView("dashboard"):onLogout} backLabel={restaurants.length>0?"← Tableau de bord":"Déconnexion"} topSlot={<BrandBar subtitle="Mes restaurants"/>}>
      <div style={{paddingTop:8}}>
        {restaurants.map(r=>(
          <div key={r.id} onClick={()=>{setActiveId(r.id);setView("dashboard");}} style={{background:r.id===activeId?C.accentSoft:C.card,border:`2px solid ${r.id===activeId?C.accent:C.border}`,borderRadius:16,padding:"14px 16px",marginBottom:12,cursor:"pointer",display:"flex",alignItems:"center",gap:12,transition:"all 0.15s"}}>
            <div style={{fontSize:32}}>{r.image_emoji||"🍽️"}</div>
            <div style={{flex:1}}>
              <div style={{color:C.text,fontWeight:700,fontSize:15}}>{r.nom}</div>
              <div style={{color:C.muted,fontSize:12}}>{r.adresse}, {r.ville}</div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:r.disponible?"#22c55e":"#6b7280",display:"inline-block"}}/>
                <span style={{color:r.disponible?C.green:C.muted,fontSize:12}}>{r.disponible?"Visible":"Masqué"}</span>
              </div>
            </div>
            {r.id===activeId&&<span style={{color:C.accent,fontSize:18}}>✓</span>}
          </div>
        ))}
        <div style={{height:16}}/>
        <button onClick={()=>setView("add")} style={{width:"100%",padding:"14px 0",borderRadius:14,border:`2px dashed ${C.accent}`,background:"transparent",color:C.accent,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          + Ajouter un restaurant
        </button>
        <div style={{height:12}}/>
        <button onClick={onLogout} style={{width:"100%",padding:"12px 0",borderRadius:14,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
          Se déconnecter
        </button>
      </div>
    </PageShell>
  );

  if(view==="reservations") return(
    <ReservationsView
      user={user}
      activeRestoId={activeId}
      onBack={()=>setView("dashboard")}
    />
  );

  if(view==="add") return(
    <EditRestaurant
      resto={{nom:"",siret:"",adresse:"",ville:"Annecy",cuisines:[],image:"🍽️",lat:null,lng:null,prix_moyen:30}}
      onSave={async r=>{
        try{
          const {data:saved,error}=await db().from("restaurants").insert({
            restaurateur_id:user.id, nom:r.nom, siret:r.siret||null,
            adresse:r.adresse, ville:r.ville, cuisines:r.cuisines,
            image_emoji:r.image||"🍽️", latitude:r.lat||null, longitude:r.lng||null,
            prix_moyen:r.prix_moyen||null, nb_tables_2:0, nb_tables_4:0,
            disponible:false, actif:true,
          }).select().single();
          if(error) throw new Error(error.message);
          setRestaurants(rs=>[...rs,saved]);
          setActiveId(saved.id);
          setToast({message:"🎉 Restaurant ajouté avec succès !",type:"success"});
          setView("dashboard");
        }catch(e){
          setToast({message:"Erreur : "+e.message,type:"error"});
          setView("dashboard");
        }
      }}
      onCancel={()=>restaurants.length>0?setView("select"):setView("dashboard")}
    />
  );

  if(!active) return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
      <div style={{padding:"52px 20px 16px",background:`linear-gradient(180deg,rgba(255,92,58,0.07),transparent)`}}>
        <BackBtn onBack={onLogout} label="Déconnexion"/>
        <BrandBar subtitle="Mon espace"/>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:16}}>🏪</div>
        <div style={{color:C.text,fontSize:20,fontWeight:800,marginBottom:8}}>Aucun restaurant configuré</div>
        <div style={{color:C.muted,fontSize:14,lineHeight:1.6,marginBottom:32}}>
          Ajoutez votre premier restaurant<br/>pour commencer à utiliser IOK
        </div>
        <button onClick={()=>setView("add")} style={{width:"100%",maxWidth:320,padding:"16px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#FF5C3A,#FF8C42)",color:"white",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit",boxShadow:`0 4px 20px ${C.accentGlow}`}}>
          + Ajouter mon premier restaurant
        </button>
        <div style={{height:12}}/>
        <button onClick={onLogout} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 24px",color:C.muted,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
          Se déconnecter
        </button>
      </div>
    </div>
  );

  return(
    <PageShell onBack={onLogout} backLabel="Déconnexion" onHome={onHome} topSlot={
      <div>
        {toast&&<Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)}/>}
        <BrandBar subtitle={active.nom} right={
          <div style={{background:planInfo.id==="trial"?C.greenSoft:C.accentSoft,border:`1px solid ${planInfo.id==="trial"?"rgba(34,197,94,0.4)":C.accent}`,borderRadius:8,padding:"3px 10px",fontSize:10,color:planInfo.id==="trial"?C.green:C.accent,fontWeight:700,flexShrink:0}}>
            {planInfo.id==="trial"?"🎁 Essai":"⚡ "+planInfo.name}
          </div>
        }/>
        {restaurants.length>1&&(
          <button onClick={()=>setView("select")} style={{marginTop:8,background:"rgba(255,255,255,0.06)",border:`1px solid ${C.border}`,borderRadius:10,padding:"6px 14px",color:C.sub,fontSize:12,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
            <span>{active.image_emoji}</span> {active.nom} <span style={{color:C.accent}}>▾ changer</span>
          </button>
        )}
      </div>
    }>
      <div style={{paddingTop:4}}>
        <div style={{color:C.muted,fontSize:12,marginBottom:16}}>{active.cuisines?.join(" · ")} · {active.ville}</div>
        <button onClick={toggle} disabled={saving} style={{width:"100%",padding:"22px 0",borderRadius:20,border:"none",background:active.disponible?"linear-gradient(135deg,#15803d,#22c55e)":"linear-gradient(135deg,#991b1b,#ef4444)",color:"white",fontSize:17,fontWeight:800,cursor:saving?"wait":"pointer",boxShadow:active.disponible?"0 6px 32px rgba(34,197,94,0.4)":"0 6px 32px rgba(239,68,68,0.3)",transition:"all 0.3s",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginBottom:14,opacity:saving?0.7:1}}>
          <span style={{fontSize:28}}>{active.disponible?"🟢":"🔴"}</span>
          <div style={{textAlign:"left"}}><div>{active.disponible?"Visible des clients":"Non visible"}</div><div style={{fontSize:12,opacity:0.8,fontWeight:400}}>{active.disponible?"Appuyez pour masquer":"Appuyez pour activer · 30 min"}</div></div>
        </button>
        {active.disponible&&(
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{color:C.sub,fontSize:12}}>Expire dans</span><span style={{color:C.green,fontWeight:700,fontSize:15,fontFamily:"monospace"}}>{fmt(timeLeft)}</span></div>
            <div style={{background:"rgba(255,255,255,0.06)",borderRadius:8,height:8,overflow:"hidden"}}><div style={{width:`${progress}%`,height:"100%",background:"linear-gradient(90deg,#22c55e,#4ade80)",transition:"width 1s linear",borderRadius:8}}/></div>
            <div style={{color:C.muted,fontSize:11,marginTop:6}}>Repassera automatiquement rouge à expiration</div>
          </div>
        )}

        {/* ── PromoFlash ── */}
        <div style={{background:C.card,border:`1px solid ${active.promo_active?"rgba(34,197,94,0.4)":C.border}`,borderRadius:20,padding:18,marginBottom:14}}>
          <div style={{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:14}}>⭐ PromoFlash</div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {[5,10,20,30].map(pct=>(
              <button key={pct} onClick={()=>updateResto({promo_pct:pct})}
                style={{flex:1,padding:"10px 0",borderRadius:12,border:`2px solid ${(active.promo_pct||10)===pct?C.accent:C.border}`,background:(active.promo_pct||10)===pct?C.accentSoft:"transparent",color:(active.promo_pct||10)===pct?C.accent:C.muted,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                {pct}%
              </button>
            ))}
          </div>
          <div onClick={togglePromo} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",borderRadius:14,cursor:"pointer",background:active.promo_active?"rgba(34,197,94,0.08)":"rgba(255,255,255,0.03)",border:`1px solid ${active.promo_active?"rgba(34,197,94,0.4)":C.border}`,transition:"all 0.2s"}}>
            <div>
              <div style={{color:C.text,fontWeight:700,fontSize:14}}>{active.promo_active?`⭐ Promo ${active.promo_pct||10}% active !`:"Activer une promotion"}</div>
              <div style={{color:C.muted,fontSize:12,marginTop:2}}>{active.promo_active?`Expire dans ${fmt(Math.max(0,new Date(active.promo_jusqu||0)-new Date()))}`:` ${active.promo_pct||10}% de réduction sur l'addition`}</div>
            </div>
            <div style={{width:46,height:26,borderRadius:13,background:active.promo_active?"#22c55e":"rgba(255,255,255,0.1)",position:"relative",transition:"all 0.2s",flexShrink:0}}>
              <div style={{width:22,height:22,borderRadius:"50%",background:"white",position:"absolute",top:2,left:active.promo_active?22:2,transition:"left 0.2s",boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}}/>
            </div>
          </div>
        </div>

        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:18,marginBottom:14}}>
          <div style={{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:14}}>Tables disponibles</div>
          {[{key:"nb_tables_2",label:"Tables de 2 personnes",icon:"👥"},{key:"nb_tables_4",label:"Tables de 4 personnes",icon:"👨‍👩‍👧‍👦"}].map(t=>(
            <div key={t.key} style={{marginBottom:16}}>
              <div style={{color:C.sub,fontSize:13,marginBottom:8}}>{t.icon} {t.label}</div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <button onClick={()=>updateTables(t.key,Math.max(0,(active[t.key]||0)-1))} style={{width:44,height:44,borderRadius:12,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:22,cursor:"pointer",fontFamily:"inherit"}}>−</button>
                <div style={{flex:1,textAlign:"center",fontSize:28,fontWeight:800,color:C.text,background:C.surface,borderRadius:12,padding:"8px 0"}}>{active[t.key]||0}</div>
                <button onClick={()=>updateTables(t.key,(active[t.key]||0)+1)} style={{width:44,height:44,borderRadius:12,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:22,cursor:"pointer",fontFamily:"inherit"}}>+</button>
              </div>
            </div>
          ))}
          <div onClick={toggleGrandeDispo} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderRadius:14,cursor:"pointer",background:active.grande_disponibilite?C.greenSoft:"rgba(255,255,255,0.03)",border:`1px solid ${active.grande_disponibilite?"rgba(34,197,94,0.4)":C.border}`,transition:"all 0.2s"}}>
            <div><div style={{color:C.text,fontWeight:600,fontSize:14}}>Grande disponibilité</div><div style={{color:C.muted,fontSize:12}}>Signaler beaucoup de place</div></div>
            <div style={{width:46,height:26,borderRadius:13,background:active.grande_disponibilite?C.green:"rgba(255,255,255,0.1)",position:"relative",transition:"all 0.2s",flexShrink:0}}><div style={{width:22,height:22,borderRadius:"50%",background:"white",position:"absolute",top:2,left:active.grande_disponibilite?22:2,transition:"left 0.2s",boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}}/></div>
          </div>
        </div>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:18,marginBottom:14}}>
          <div style={{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:14}}>Aperçu client</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            {[{i:"👥",v:active.nb_tables_2||0,l:"× 2 pers."},{i:"👨‍👩‍👧‍👦",v:active.nb_tables_4||0,l:"× 4 pers."},{i:active.disponible?"🟢":"🔴",v:active.disponible?"Visible":"Masqué",l:"Statut"}].map((s,idx)=>(
              <div key={idx} style={{background:C.surface,borderRadius:12,padding:"12px 0",textAlign:"center"}}><div style={{fontSize:22}}>{s.i}</div><div style={{color:C.text,fontWeight:800,fontSize:idx<2?22:13,marginTop:2}}>{s.v}</div><div style={{color:C.muted,fontSize:10}}>{s.l}</div></div>
            ))}
          </div>
        </div>

        {/* Bouton Réservations */}
        <button onClick={()=>setView("reservations")} style={{width:"100%",padding:"14px 0",borderRadius:16,border:`1px solid rgba(59,130,246,0.3)`,background:"rgba(59,130,246,0.08)",color:"#60a5fa",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
          <span style={{fontSize:20}}>📋</span> Voir les réservations
        </button>

        {/* Fiabilité du restaurateur */}
        {user.fiabilite_statut&&(
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:16,marginBottom:14}}>
            <div style={{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>Ma fiabilité</div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <FiabiliteBadge statut={user.fiabilite_statut||"nouveau"}/>
              <div style={{flex:1}}>
                <div style={{color:C.muted,fontSize:12}}>
                  {user.total_reservations||0} réservations au total
                </div>
                <div style={{color:C.muted,fontSize:12}}>
                  {user.reservations_honorees||0} honorées sur les 10 dernières
                </div>
              </div>
            </div>
            {(user.total_reservations||0) < 10 && (
              <div style={{color:C.muted,fontSize:11,marginTop:8}}>
                ℹ️ Le statut s'affiche après 10 réservations
              </div>
            )}
          </div>
        )}

        <div style={{background:`linear-gradient(135deg,${planInfo.id==="trial"?"rgba(34,197,94,0.08),rgba(34,197,94,0.03)":"rgba(255,92,58,0.1),rgba(255,140,66,0.05)"})`,border:`1px solid ${planInfo.id==="trial"?"rgba(34,197,94,0.25)":"rgba(255,92,58,0.25)"}`,borderRadius:16,padding:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:planInfo.id==="trial"?C.green:C.accent,fontWeight:700,fontSize:13}}>{planInfo.id==="trial"?"🎁 Essai gratuit":"⚡ Plan "+planInfo.name} — actif</div><div style={{color:C.muted,fontSize:12,marginTop:2}}>{restaurants.length} restaurant{restaurants.length>1?"s":""}</div></div>
          <div style={{color:C.text,fontSize:18,fontWeight:900}}>{planInfo.price===0?"Gratuit":`${planInfo.price}€`}<span style={{color:C.muted,fontSize:10}}>{planInfo.price>0?"/mois":""}</span></div>
        </div>
      </div>
    </PageShell>
  );
}

/* ══ RESERVATIONS VIEW ══════════════════════════════ */
function ReservationsView({user, activeRestoId, onBack}){
  const [reservations, setReservations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("all"); // all | today | confirmed
  const [toastMsg, setToastMsg] = useState(null);

  useEffect(()=>{
    if(toastMsg){ const t=setTimeout(()=>setToastMsg(null),2500); return()=>clearTimeout(t); }
  },[toastMsg]);

  useEffect(()=>{
    const load = async()=>{
      setLoading(true);
      try{
        let query = db()
          .from("reservations")
          .select("*, clients(prenom, nom, fiabilite_statut, total_reservations)")
          .eq("restaurant_id", activeRestoId)
          .order("created_at", {ascending: false});

        if(filter === "today"){
          const today = new Date();
          today.setHours(0,0,0,0);
          query = query.gte("created_at", today.toISOString());
        } else if(filter === "confirmed"){
          query = query.eq("statut","confirmee");
        }

        const {data, error} = await query.limit(50);
        if(error) console.error("Reservations error:", error);
        if(data) setReservations(data);
      }catch(e){ console.error(e); }
      setLoading(false);
    };
    load();
    // Rafraîchit toutes les 30s
    const t = setInterval(load, 30000);
    return ()=>clearInterval(t);
  },[activeRestoId, filter]);

  const getStatutStyle = (statut) => {
    if(statut==="confirmee")     return {bg:"rgba(59,130,246,0.12)", color:"#60a5fa", label:"⏳ Confirmée"};
    if(statut==="rappel_envoye") return {bg:"rgba(234,179,8,0.12)",  color:"#eab308", label:"📱 Rappel envoyé"};
    if(statut==="prolongee")     return {bg:"rgba(168,85,247,0.12)", color:"#a855f7", label:"⏱️ Prolongée +5min"};
    if(statut==="arrivee")       return {bg:"rgba(34,197,94,0.12)",  color:"#22c55e", label:"🪑 Client installé"};
    if(statut==="terminee")      return {bg:"rgba(107,114,128,0.12)",color:"#6b7280", label:"✓ Terminée"};
    if(statut==="annulee")       return {bg:"rgba(239,68,68,0.12)",  color:"#ef4444", label:"✗ Annulée"};
    if(statut==="no_show")       return {bg:"rgba(239,68,68,0.12)",  color:"#ef4444", label:"👻 No-show"};
    return {bg:"rgba(234,179,8,0.12)",color:"#eab308",label:"⏳ En attente"};
  };

  const formatDate = (iso) => {
    const d = new Date(iso);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    if(isToday) return "Aujourd'hui " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  };

  const tableLabel = (r) => {
    if(r.table_type==="2") return "👥 Table 2 pers.";
    if(r.table_type==="4") return "👨‍👩‍👧‍👦 Table 4 pers.";
    return `${r.nb_personnes} pers.`;
  };

  return(
    <PageShell onBack={onBack} backLabel="← Tableau de bord" topSlot={<BrandBar subtitle="Réservations"/>}>
      {toastMsg&&<Toast message={toastMsg} type="success" onClose={()=>setToastMsg(null)}/>}
      {/* Filtres */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[{v:"all",l:"Toutes"},{v:"today",l:"Aujourd'hui"},{v:"confirmed",l:"Confirmées"}].map(f=>(
          <button key={f.v} onClick={()=>setFilter(f.v)} style={{flex:1,padding:"8px 0",borderRadius:10,border:`1px solid ${filter===f.v?C.accent:C.border}`,background:filter===f.v?C.accentSoft:"transparent",color:filter===f.v?C.accent:C.muted,fontSize:12,fontWeight:filter===f.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
            {f.l}
          </button>
        ))}
      </div>

      {loading&&(
        <div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>
          <div style={{fontSize:24,marginBottom:8}}>⚡</div>
          <div style={{fontSize:13}}>Chargement...</div>
        </div>
      )}

      {!loading&&reservations.length===0&&(
        <div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>
          <div style={{fontSize:40,marginBottom:12}}>📋</div>
          <div style={{fontSize:14}}>Aucune réservation</div>
          <div style={{fontSize:12,marginTop:6}}>Les réservations apparaîtront ici</div>
        </div>
      )}

      {!loading&&reservations.map(r=>{
        const s = getStatutStyle(r.statut);
        return(
          <div key={r.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:16,marginBottom:12}}>
            {/* Header: nom + statut */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{color:C.text,fontWeight:800,fontSize:16}}>
                    {r.client_prenom} {r.client_nom}
                  </div>
                  <FiabiliteBadge statut={r.clients?.fiabilite_statut||r.client_fiabilite||"nouveau"} small={true}/>
                </div>
                <div style={{color:C.muted,fontSize:12,marginTop:2}}>{formatDate(r.created_at)}</div>
              </div>
              <div style={{background:s.bg,color:s.color,fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:20,whiteSpace:"nowrap"}}>
                {s.label}
              </div>
            </div>

            {/* Infos réservation */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              <div style={{background:C.surface,borderRadius:10,padding:"8px 12px"}}>
                <div style={{color:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>Table</div>
                <div style={{color:C.text,fontWeight:700,fontSize:13}}>{tableLabel(r)}</div>
              </div>
              <div style={{background:C.surface,borderRadius:10,padding:"8px 12px"}}>
                <div style={{color:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>Téléphone</div>
                <div style={{color:C.text,fontWeight:700,fontSize:13}}>{r.client_telephone}</div>
              </div>
            </div>
            {/* Timer depuis la réservation */}
            {(r.statut==="confirmee"||r.statut==="rappel_envoye"||r.statut==="prolongee")&&(()=>{
              const elapsed = Math.floor((new Date()-new Date(r.created_at))/60000);
              const isLate = elapsed >= 25;
              const isVeryLate = elapsed >= 30;
              return(
                <div style={{background:isVeryLate?"rgba(239,68,68,0.1)":isLate?"rgba(234,179,8,0.1)":"rgba(59,130,246,0.08)",border:`1px solid ${isVeryLate?"rgba(239,68,68,0.3)":isLate?"rgba(234,179,8,0.3)":"rgba(59,130,246,0.2)"}`,borderRadius:10,padding:"8px 12px",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:16}}>{isVeryLate?"⏰":isLate?"⚠️":"⏱️"}</span>
                  <div>
                    <div style={{color:isVeryLate?"#ef4444":isLate?"#eab308":"#60a5fa",fontWeight:700,fontSize:13}}>
                      {isVeryLate?"SMS rappel à envoyer":isLate?"Bientôt 30 minutes":"En cours"}
                    </div>
                    <div style={{color:C.muted,fontSize:11}}>Réservé il y a {elapsed} min</div>
                  </div>
                  {isVeryLate&&r.statut==="confirmee"&&(
                    <button onClick={async()=>{
                      // Simule envoi SMS rappel - marque statut
                      await db().from("reservations").update({
                        statut:"rappel_envoye",
                        sms_rappel_at:new Date().toISOString()
                      }).eq("id",r.id);
                      setReservations(rs=>rs.map(x=>x.id===r.id?{...x,statut:"rappel_envoye"}:x));
                    }} style={{marginLeft:"auto",padding:"6px 12px",borderRadius:8,border:"none",background:"#ef4444",color:"white",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
                      📱 SMS rappel
                    </button>
                  )}
                </div>
              );
            })()}

            {/* Actions */}
            <div style={{display:"flex",gap:8}}>
              <a href={`tel:${r.client_telephone}`} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid rgba(59,130,246,0.3)`,background:"rgba(59,130,246,0.08)",color:"#60a5fa",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textDecoration:"none",textAlign:"center",display:"block"}}>
                📞 Appeler
              </a>
              {(r.statut==="confirmee"||r.statut==="prolongee"||r.statut==="rappel_envoye")&&(
                <button onClick={async()=>{
                  const now = new Date().toISOString();
                  await db().from("reservations").update({
                    statut:"arrivee",
                    arrive_confirme:true,
                    arrive_confirme_at:now,
                  }).eq("id",r.id);
                  // Recalcule fiabilité via le trigger SQL automatiquement
                  setReservations(rs=>rs.map(x=>x.id===r.id?{...x,statut:"arrivee",arrive_confirme:true}:x));
                  setToastMsg("✅ Client installé — fiabilité mise à jour");
                }} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid rgba(34,197,94,0.3)`,background:"rgba(34,197,94,0.08)",color:"#22c55e",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                  🪑 Client installé
                </button>
              )}
              {r.statut==="arrivee"&&(
                <button onClick={async()=>{
                  await db().from("reservations").update({statut:"terminee"}).eq("id",r.id);
                  setReservations(rs=>rs.map(x=>x.id===r.id?{...x,statut:"terminee"}:x));
                }} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid rgba(34,197,94,0.3)`,background:"rgba(34,197,94,0.08)",color:"#22c55e",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                  ✓ Repas terminé
                </button>
              )}
              {r.statut==="confirmee"&&(
                <button onClick={async()=>{
                  if(!window.confirm("Annuler cette réservation ?")) return;
                  // Remet la table disponible
                  const tableKey = r.table_type==="2"?"nb_tables_2":r.table_type==="4"?"nb_tables_4":null;
                  if(tableKey){
                    const {data:resto} = await db().from("restaurants").select(tableKey).eq("id",r.restaurant_id).single();
                    if(resto) await db().from("restaurants").update({[tableKey]:(resto[tableKey]||0)+1}).eq("id",r.restaurant_id);
                  }
                  await db().from("reservations").update({statut:"annulee"}).eq("id",r.id);
                  setReservations(rs=>rs.map(x=>x.id===r.id?{...x,statut:"annulee"}:x));
                }} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid rgba(239,68,68,0.3)`,background:"rgba(239,68,68,0.08)",color:"#ef4444",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                  ✗ Annuler
                </button>
              )}
            </div>
          </div>
        );
      })}
    </PageShell>
  );
}
