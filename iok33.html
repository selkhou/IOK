/* ══ LEAFLET MAP COLORED (3 couleurs) ══════════════ */
function LeafletMapColored({restaurants,selected,onSelect,city,height=260,loading,userLocation}){
  const mapRef=useRef(null);
  const instanceRef=useRef(null);
  const markersRef=useRef([]);
  const cityObj=CITIES.find(c=>c.id===city)||CITIES[0];

  const buildIcon=(r,isSel)=>{
    const isOsm=!r._iok;
    const ok=r._iok&&r.disponible&&r.disponible_jusqu&&new Date(r.disponible_jusqu)>new Date();
    const promoOk=r.promo_active&&r.promo_jusqu&&new Date(r.promo_jusqu)>new Date();
    // Vérifie paramètre promo_liee_dispo
    const promoVisible = promoOk && (!window.IOK_PARAMS.promo_liee_dispo || ok);

    let color, ringColor;
    if(!r._iok){
      color="#9ca3af"; ringColor="rgba(156,163,175,0.3)";
    } else if(ok){
      color="#22c55e"; ringColor="rgba(34,197,94,0.4)";
    } else {
      color="#ef4444"; ringColor="rgba(239,68,68,0.3)";
    }

    const size=isSel?32:22;
    const ring=ok?`<div style="position:absolute;inset:-5px;border-radius:50%;border:2px solid ${ringColor};opacity:0.6;animation:mapPulse 2s ease-in-out infinite;"></div>`:"";
    // Étoile promo clignotante
    const promoBadge=promoVisible?`<div style="position:absolute;top:-6px;right:-6px;background:#22c55e;color:white;font-size:8px;font-weight:800;padding:2px 4px;border-radius:6px;animation:promoPulse 1.5s ease-in-out infinite;line-height:1.2;">-${r.promo_pct||10}%</div>`:"";
    const star=r._plan==="premium"&&!promoVisible?`<div style="position:absolute;top:-4px;right:-4px;font-size:8px;line-height:1;">⭐</div>`:"";

    return window.L.divIcon({
      html:`<div style="position:relative;width:${size}px;height:${size}px;">${ring}<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:${isSel?3:2}px solid ${isOsm?"rgba(255,255,255,0.4)":"white"};box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:${isSel?13:9}px;opacity:${isOsm?0.7:1};">${r.image_emoji||"🍽️"}</div>${star}${promoBadge}</div>`,
      className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
    });
  };

  useEffect(()=>{
    if(!mapRef.current||instanceRef.current) return;
    const L=window.L;
    const cLat=userLocation?.lat||cityObj.lat;
    const cLng=userLocation?.lng||cityObj.lng;
    const map=L.map(mapRef.current,{center:[cLat,cLng],zoom:cityObj.zoom,zoomControl:true,attributionControl:true});
    window._iokMap=map; // ref globale pour géoloc
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    // Marqueur vous
    L.marker([cLat,cLng],{icon:L.divIcon({html:`<div style="width:18px;height:18px;border-radius:50%;background:#3b82f6;border:3px solid white;box-shadow:0 0 0 6px rgba(59,130,246,0.25);"></div>`,className:"",iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map).bindPopup("📍 Vous êtes ici",{className:"iok-popup"});
    instanceRef.current=map;
    // CSS animation pour les halos
    if(!document.getElementById("map-pulse-style")){
      const s=document.createElement("style");
      s.id="map-pulse-style";
      s.textContent=`@keyframes mapPulse{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.4);opacity:0.2}}`;
      document.head.appendChild(s);
    }
    setTimeout(()=>map.invalidateSize(),200);
    return()=>{map.remove();instanceRef.current=null;};
  },[]);

  useEffect(()=>{if(instanceRef.current)instanceRef.current.setView([cityObj.lat,cityObj.lng],cityObj.zoom);},[city]);

  useEffect(()=>{
    const map=instanceRef.current;
    if(!map||!window.L) return;
    markersRef.current.forEach(m=>map.removeLayer(m));
    markersRef.current=[];
    (restaurants||[]).forEach(r=>{
      if(!r.latitude||!r.longitude) return;
      const isSel=selected?.id===r.id;
      const ok=r._iok&&r.disponible&&r.disponible_jusqu&&new Date(r.disponible_jusqu)>new Date();
      const m=window.L.marker([r.latitude,r.longitude],{icon:buildIcon(r,isSel)});
      m.addTo(map);
      const statusLine=r._iok
        ?(ok?`<span style="color:#4ade80;font-weight:700;">${Math.floor(Math.max(0,new Date(r.disponible_jusqu)-new Date())/60000)}min restant</span>`:`<span style="color:#6b7280;">Indisponible</span>`)
        :`<span style="color:#ef4444;font-size:11px;">Non partenaire IOK</span>`;
      const cuisineStr=(r.cuisines||[]).slice(0,2).join(", ")||"Restaurant";
      m.bindPopup(`<div><b style="font-size:13px;">${r.image_emoji||"🍽️"} ${r.nom}</b><br/><span style="color:#9CA3AF;font-size:11px;">${cuisineStr}${r.prix_moyen?" · ~"+r.prix_moyen+"€":""}</span><br/>${statusLine}</div>`,{className:"iok-popup",maxWidth:200});
      m.on("click",()=>{if(onSelect)onSelect(r);});
      markersRef.current.push(m);
    });
  },[restaurants,selected]);

  return(
    <div style={{borderRadius:20,overflow:"hidden",border:`1px solid ${C.border}`,marginBottom:14,position:"relative"}}>
      <div ref={mapRef} style={{height,width:"100%",display:"block"}}/>
      {loading&&(
        <div style={{position:"absolute",bottom:40,right:10,background:"rgba(12,13,15,0.85)",borderRadius:8,padding:"4px 10px",fontSize:11,color:C.muted,zIndex:1000}}>
          ⏳ Chargement restaurants…
        </div>
      )}
    </div>
  );
}

/* ══ CLIENT DASHBOARD — Mes réservations ════════════════════ */
function ClientDashboard({onBack, onHome}){
  const [authStep, setAuthStep] = useState("phone"); // phone | otp | dashboard
  const [phone, setPhone] = useState("");
  const [otp, setOtp] = useState(["","","","","",""]);
  const [clientData, setClientData] = useState(null);
  const [reservations, setReservations] = useState([]);
  const [tab, setTab] = useState("recent"); // recent | history
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [tick, setTick] = useState(0);
  const otpRefs = useRef([]);

  // Tick toutes les secondes pour les comptes à rebours
  useEffect(()=>{
    const t = setInterval(()=>setTick(x=>x+1), 1000);
    return ()=>clearInterval(t);
  },[]);

  const handleOtpInput=(i,v)=>{
    const d=v.replace(/\D/g,"").slice(-1);
    const nc=[...otp]; nc[i]=d; setOtp(nc);
    if(d&&i<5) otpRefs.current[i+1]?.focus();
  };

  // Envoi OTP
  const sendOTP = async()=>{
    setError(""); setLoading(true);
    try{
      const tel = "+33"+phone.replace(/\s/g,"").replace(/^0/,"");
      const {data:client} = await db().from("clients").select("*").eq("telephone",tel).maybeSingle();
      if(!client) throw new Error("Numéro introuvable. Créez un compte en réservant.");
      const otpCode = TEST_MODE()?"123456":String(Math.floor(100000+Math.random()*900000));
      await db().from("clients").update({otp_code:otpCode, otp_expires_at:new Date(Date.now()+5*60*1000).toISOString()}).eq("id",client.id);
      console.log("OTP client (test):", otpCode);
      setClientData({...client, _otp:otpCode});
      setAuthStep("otp");
    }catch(e){ setError(e.message); }
    finally{ setLoading(false); }
  };

  // Vérification OTP
  const verifyOTP = async()=>{
    setError(""); setLoading(true);
    try{
      const entered = otp.join("");
      if(TEST_MODE()){
        if(entered!=="123456") throw new Error("Code invalide. En mode test : 123456");
      } else {
        if(entered!==clientData._otp) throw new Error("Code invalide.");
        if(new Date()>new Date(clientData.otp_expires_at)) throw new Error("Code expiré.");
      }
      await db().from("clients").update({derniere_connexion:new Date().toISOString(), otp_code:null}).eq("id",clientData.id);
      setAuthStep("dashboard");
      loadReservations(clientData.id);
    }catch(e){ setError(e.message); }
    finally{ setLoading(false); }
  };

  // Charge les réservations
  const loadReservations = async(clientId)=>{
    setLoading(true);
    try{
      const {data} = await db().from("reservations")
        .select("*, restaurants(nom, adresse, telephone, image_emoji, ville)")
        .eq("client_id", clientId)
        .order("created_at", {ascending:false});
      setReservations(data||[]);
    }catch(e){ console.error(e); }
    setLoading(false);
  };

  // Annuler une réservation
  const cancelResa = async(resa)=>{
    if(!window.confirm("Annuler cette réservation ?")) return;
    // Remet la table disponible
    const tableKey = resa.table_type==="2"?"nb_tables_2":"nb_tables_4";
    const {data:resto} = await db().from("restaurants").select(tableKey).eq("id",resa.restaurant_id).single();
    if(resto) await db().from("restaurants").update({[tableKey]:(resto[tableKey]||0)+1}).eq("id",resa.restaurant_id);
    await db().from("reservations").update({statut:"annulee"}).eq("id",resa.id);
    setReservations(rs=>rs.map(r=>r.id===resa.id?{...r,statut:"annulee"}:r));
  };

  // Calcule le temps restant et la couleur
  const getTimer = (resa)=>{
    if(resa.statut!=="confirmee") return null;
    const created = new Date(resa.created_at);
    const duree = (window.IOK_PARAMS.duree_resa_min||30) * 60 * 1000;
    const alerteMs = (window.IOK_PARAMS.alerte_orange_min||10) * 60 * 1000;
    const elapsed = Date.now() - created.getTime();
    const remaining = duree - elapsed;
    if(remaining <= 0) return {ms:0, color:"#ef4444", label:"Expiré"};
    const color = remaining < alerteMs ? "#f97316" : "#22c55e";
    return {ms:remaining, color, label:fmt(remaining)};
  };

  // Filtre les réservations
  const recent = reservations.filter(r=>{
    const d = new Date(r.created_at);
    return Date.now()-d.getTime() < 24*60*60*1000;
  });
  const history = reservations.filter(r=>{
    const d = new Date(r.created_at);
    return Date.now()-d.getTime() >= 24*60*60*1000;
  });

  const displayed = tab==="recent" ? recent : history;

  // Statut label + couleur
  const getStatutStyle=(s)=>({
    confirmee:   {color:"#3b82f6", label:"⏳ En attente"},
    arrivee:     {color:"#22c55e", label:"🪑 Installé"},
    terminee:    {color:"#6b7280", label:"✓ Terminée"},
    annulee:     {color:"#ef4444", label:"✗ Annulée"},
    no_show:     {color:"#ef4444", label:"👻 No-show"},
    rappel_envoye:{color:"#eab308",label:"📱 Rappel envoyé"},
    prolongee:   {color:"#a855f7", label:"⏱️ Prolongée"},
  }[s]||{color:C.muted, label:s});

  // ── Écran saisie téléphone ─────────────────────────────────
  if(authStep==="phone") return(
    <PageShell onBack={onBack} backLabel="Accueil" onHome={onHome} topSlot={<BrandBar subtitle="Mon compte"/>}>
      <div style={{paddingTop:24, textAlign:"center"}}>
        <div style={{fontSize:48, marginBottom:16}}>👤</div>
        <div style={{color:C.text, fontSize:22, fontWeight:800, marginBottom:6}}>Accès à mon compte</div>
        <div style={{color:C.muted, fontSize:13, marginBottom:28, lineHeight:1.5}}>
          Entrez votre numéro pour voir<br/>vos réservations
        </div>
        <FInput label="Téléphone mobile" value={phone} onChange={setPhone}
          placeholder="06 12 34 56 78" prefix="🇫🇷 +33" type="tel" required={true}/>
        {TEST_MODE()&&<div style={{background:"rgba(234,179,8,0.1)",border:"1px solid rgba(234,179,8,0.2)",borderRadius:10,padding:"8px 14px",marginBottom:14,color:"#eab308",fontSize:12}}>
          🧪 Mode test — code OTP fixe : <strong>123456</strong>
        </div>}
        {error&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:C.red,fontSize:13}}>⚠️ {error}</div>}
        <Btn onClick={sendOTP} disabled={phone.replace(/\s/g,"").length<9} loading={loading}>
          Recevoir mon code →
        </Btn>
      </div>
    </PageShell>
  );

  // ── Écran OTP ──────────────────────────────────────────────
  if(authStep==="otp") return(
    <PageShell onBack={()=>{setAuthStep("phone");setError("");setOtp(["","","","","",""]);}} backLabel="← Modifier" onHome={onHome} topSlot={<BrandBar subtitle="Mon compte"/>}>
      <div style={{paddingTop:24, textAlign:"center"}}>
        <div style={{fontSize:48, marginBottom:12}}>💬</div>
        <div style={{color:C.text, fontSize:20, fontWeight:800, marginBottom:4}}>Code envoyé !</div>
        <div style={{color:C.green, fontSize:14, fontWeight:600, marginBottom:24}}>
          Bonjour {clientData?.prenom} 👋
        </div>
        <div style={{display:"flex", gap:8, justifyContent:"center", marginBottom:20}}>
          {otp.map((d,i)=>(
            <input key={i} ref={el=>otpRefs.current[i]=el} value={d}
              onChange={e=>handleOtpInput(i,e.target.value)}
              onKeyDown={e=>{if(e.key==="Backspace"&&!d&&i>0){otpRefs.current[i-1]?.focus();const nc=[...otp];nc[i-1]="";setOtp(nc);}}}
              maxLength={1} type="number"
              style={{width:44,height:54,borderRadius:12,textAlign:"center",fontSize:22,fontWeight:700,background:C.card,border:`2px solid ${d?C.accent:C.border}`,color:C.text,outline:"none",fontFamily:"monospace"}}/>
          ))}
        </div>
        {error&&<div style={{color:C.red, fontSize:12, marginBottom:14}}>⚠️ {error}</div>}
        <Btn onClick={verifyOTP} disabled={otp.join("").length<6} loading={loading}>
          Accéder à mes réservations →
        </Btn>
      </div>
    </PageShell>
  );

  // ── Dashboard réservations ─────────────────────────────────
  return(
    <PageShell onBack={onBack} backLabel="Accueil" onHome={onHome} topSlot={
      <div>
        <BrandBar subtitle="Mes réservations"/>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,background:C.greenSoft,border:`1px solid rgba(34,197,94,0.25)`,borderRadius:10,padding:"6px 12px"}}>
          <span style={{fontSize:16}}>👤</span>
          <span style={{color:C.green,fontSize:13,fontWeight:600}}>{clientData?.prenom}</span>
          <FiabiliteBadge statut={clientData?.fiabilite_statut||"nouveau"} small={true}/>
          <span style={{color:C.muted,fontSize:11,marginLeft:"auto"}}>{clientData?.total_reservations||0} résa au total</span>
        </div>
        {/* Onglets */}
        <div style={{display:"flex",gap:8,marginTop:10}}>
          {[{v:"recent",l:`24h (${recent.length})`},{v:"history",l:`Historique (${history.length})`}].map(t=>(
            <button key={t.v} onClick={()=>setTab(t.v)} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid ${tab===t.v?C.accent:C.border}`,background:tab===t.v?C.accentSoft:"transparent",color:tab===t.v?C.accent:C.muted,fontSize:13,fontWeight:tab===t.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>
    }>
      {loading&&<div style={{textAlign:"center",padding:"40px",color:C.muted}}>⚡ Chargement…</div>}

      {!loading&&displayed.length===0&&(
        <div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>
          <div style={{fontSize:40,marginBottom:12}}>📋</div>
          <div>{tab==="recent"?"Aucune réservation dans les 24h":"Aucune réservation"}</div>
        </div>
      )}

      {!loading&&displayed.map(r=>{
        const timer = getTimer(r);
        const statut = getStatutStyle(r.statut);
        const resto = r.restaurants;
        return(
          <div key={r.id} style={{background:C.card,
            border:`2px solid ${
              r.statut==="confirmee"?(timer&&timer.ms>0?(timer.color):"#ef4444"):
              r.statut==="arrivee"||r.statut==="terminee"?"#6b7280":
              r.statut==="annulee"||r.statut==="no_show"?"#ef4444":C.border
            }`,
            borderRadius:16,padding:16,marginBottom:12}}>
            {/* Header restaurant */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontSize:28}}>{resto?.image_emoji||"🍽️"}</span>
                <div>
                  <div style={{color:C.text,fontWeight:800,fontSize:15}}>{resto?.nom||"Restaurant"}</div>
                  <div style={{color:C.muted,fontSize:12}}>{resto?.adresse}</div>
                </div>
              </div>
              <span style={{color:statut.color,fontSize:11,fontWeight:700,background:`${statut.color}18`,padding:"3px 8px",borderRadius:10,whiteSpace:"nowrap"}}>
                {statut.label}
              </span>
            </div>

            {/* Compte à rebours si en cours */}
            {timer&&(
              <div style={{background:`${timer.color}15`,border:`1px solid ${timer.color}40`,borderRadius:10,padding:"8px 12px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span style={{color:timer.color,fontSize:13,fontWeight:600}}>
                  {timer.ms>0?"⏱️ Temps restant avant annulation":"⏰ Délai expiré"}
                </span>
                <span style={{color:timer.color,fontWeight:800,fontSize:16,fontFamily:"monospace"}}>
                  {timer.ms>0?timer.label:"00:00"}
                </span>
              </div>
            )}

            {/* Infos réservation */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              {[
                {i:"📅",v:new Date(r.created_at).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+new Date(r.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),l:"Date"},
                {i:"🪑",v:r.table_type==="2"?"2 personnes":"4 personnes",l:"Table"},
              ].map(s=>(
                <div key={s.l} style={{background:C.surface,borderRadius:10,padding:"8px 12px"}}>
                  <div style={{color:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:1}}>{s.l}</div>
                  <div style={{color:C.text,fontWeight:600,fontSize:13,marginTop:2}}>{s.i} {s.v}</div>
                </div>
              ))}
            </div>

            {/* Actions */}
            <div style={{display:"flex",gap:8}}>
              {resto?.telephone&&(
                <a href={`tel:${resto.telephone}`} style={{flex:1,padding:"9px 0",borderRadius:10,border:"1px solid rgba(59,130,246,0.3)",background:"rgba(59,130,246,0.08)",color:"#60a5fa",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textDecoration:"none",textAlign:"center",display:"block"}}>
                  📞 Appeler
                </a>
              )}
              {r.statut==="confirmee"&&(
                <button onClick={()=>cancelResa(r)} style={{flex:1,padding:"9px 0",borderRadius:10,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.08)",color:"#ef4444",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                  ✗ Annuler
                </button>
              )}
            </div>
          </div>
        );
      })}
    </PageShell>
  );
}


function ClientSearch({onBook,onBack,onHome}){
  const [city,setCity]=useState("annecy");
  const [cityName,setCityName]=useState("Annecy");
  const [citySearch,setCitySearch]=useState("");
  const [userLocation,setUserLocation]=useState(null);
  const [geoLocating,setGeoLocating]=useState(false);
  const [iokRestaurants,setIokRestaurants]=useState([]);
  const [osmRestaurants,setOsmRestaurants]=useState([]);
  const [filter,setFilter]=useState({cuisine:"Toutes",persons:0});
  const [selected,setSelected]=useState(null);
  const [showCityPicker,setShowCityPicker]=useState(false);
  const [loading,setLoading]=useState(true);
  const [loadingOsm,setLoadingOsm]=useState(false);
  const [tick,setTick]=useState(0);

  useEffect(()=>{const t=setInterval(()=>setTick(x=>x+1),1000);return()=>clearInterval(t);},[]);

  // Géolocalisation du client → trouve la ville la plus proche
  const geolocateCity=()=>{
    setGeoLocating(true);
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude:lat,longitude:lng}=pos.coords;
        setUserLocation({lat,lng});
        // Trouve la ville IOK la plus proche
        let closest=CITIES[0];
        let minDist=Infinity;
        CITIES.forEach(c=>{
          const d=Math.sqrt(Math.pow(c.lat-lat,2)+Math.pow(c.lng-lng,2));
          if(d<minDist){minDist=d;closest=c;}
        });
        setCity(closest.id);
        setCityName(closest.name);
        setGeoLocating(false);
        // Centre la carte sur la position réelle du client
        if(window._iokMap){
          window._iokMap.setView([lat,lng],15);
        }
      },
      err=>{setGeoLocating(false);console.log("Géoloc refusée:",err);},
      {enableHighAccuracy:true,timeout:8000}
    );
  };

  // Géolocalisation auto au premier chargement
  useEffect(()=>{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos=>{
          setUserLocation({lat:pos.coords.latitude,lng:pos.coords.longitude});
        },
        ()=>{} // silencieux si refusé
      );
    }
  },[]);

  // Calcule la distance en mètres entre deux points lat/lng
  const distanceM=(lat1,lng1,lat2,lng2)=>{
    const R=6371000;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLng=(lng2-lng1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  };

  // Helper: statut abonnement restaurateur
  const getRestoStatus=(r)=>{
    // r.plan + r.plan_debut + r.plan_fin depuis la jointure restaurateur
    if(!r._iok) return "none"; // pas inscrit IOK
    if(r._plan==="trial"){
      const debut=new Date(r._plan_debut||r.created_at);
      const expiry=new Date(debut.getTime()+30*24*60*60*1000);
      if(new Date()<expiry) return "trial";
      return "expired";
    }
    if(r._plan==="starter"||r._plan==="premium") return "paid";
    return "trial";
  };

  const getMarkerColor=(r)=>{
    const st=getRestoStatus(r);
    if(st==="paid") return "#22c55e";    // vert = abonné payant disponible
    if(st==="trial") return "#ef4444";  // rouge = essai ou indisponible
    return "#9ca3af";                   // gris = non inscrit
  };

  const getBadgeLabel=(r)=>{
    const st=getRestoStatus(r);
    if(st==="paid"&&r._plan==="premium") return {label:"⭐ Premium",color:"#a855f7",bg:"rgba(168,85,247,0.15)"};
    if(st==="paid") return {label:"✓ Partenaire",color:"#22c55e",bg:"rgba(34,197,94,0.12)"};
    if(st==="trial") return {label:"🆕 Essai IOK",color:"#eab308",bg:"rgba(234,179,8,0.12)"};
    return {label:"Non partenaire",color:"#6b7280",bg:"rgba(107,114,128,0.1)"};
  };

  // Charge les restaurants IOK depuis Supabase
  useEffect(()=>{
    const loadIOK=async()=>{
      setLoading(true);
      try{
        const cityObj=CITIES.find(c=>c.id===city)||CITIES[0];
        // Requête simple sans jointure pour éviter les problèmes RLS
        const {data,error}=await db()
          .from("restaurants")
          .select("*")
          .ilike("ville", cityObj.name)
          .eq("actif",true)
          .order("nom");
        
        if(error){
          console.error("IOK restaurants error:", error.message, error);
        }
        
        if(data && data.length >= 0){
          // Enrichit avec infos plan depuis restaurateurs (séparément)
          const enriched = await Promise.all(data.map(async r=>{
            let planInfo = {plan:"trial", plan_debut:null, plan_fin:null};
            try{
              const {data:rt} = await db()
                .from("restaurateurs")
                .select("plan, plan_debut, plan_fin")
                .eq("id", r.restaurateur_id)
                .single();
              if(rt) planInfo = rt;
            }catch(e){}
            return {
              ...r,
              _iok:true,
              _plan:planInfo.plan||"trial",
              _plan_debut:planInfo.plan_debut,
              _plan_fin:planInfo.plan_fin,
            };
          }));
          console.log("IOK restaurants loaded:", enriched.length, enriched.map(r=>r.nom));
          setIokRestaurants(enriched);
        }
      }catch(e){
        console.error("IOK load error:",e);
      }
      setLoading(false);
    };
    loadIOK();
    const interval=setInterval(loadIOK,30000);
    return()=>clearInterval(interval);
  },[city]);

  // Charge les restaurants OSM (Overpass API) pour la ville
  useEffect(()=>{
    const loadOSM=async()=>{
      setLoadingOsm(true);
      try{
        const cityObj=CITIES.find(c=>c.id===city)||CITIES[0];
        const r=0.015; // rayon ~1.5km autour du centre
        const bbox=`${cityObj.lat-r},${cityObj.lng-r*1.5},${cityObj.lat+r},${cityObj.lng+r*1.5}`;
        const query=`[out:json][timeout:15];(node["amenity"="restaurant"](${bbox});way["amenity"="restaurant"](${bbox}););out center 60;`;
        const url=`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
        const res=await fetch(url);
        if(!res.ok) throw new Error("OSM fetch failed");
        const json=await res.json();
        const places=(json.elements||[]).map(el=>({
          id:"osm_"+(el.id||Math.random()),
          _iok:false,
          nom:el.tags?.name||"Restaurant",
          adresse:el.tags?.["addr:street"]?(el.tags["addr:housenumber"]?" "+el.tags["addr:housenumber"]:"")+(el.tags["addr:street"]||""):"",
          cuisines:el.tags?.cuisine?[el.tags.cuisine.split(";")[0]]:[],
          image_emoji:"🍽️",
          latitude:el.lat||el.center?.lat,
          longitude:el.lon||el.center?.lon,
          disponible:false,
          prix_moyen:null,
          note_google:null,
          nb_avis_google:0,
          nb_tables_2:0,
          nb_tables_4:0,
          grande_disponibilite:false,
          disponible_jusqu:null,
        }));
        setOsmRestaurants(places);
      }catch(e){ console.error("OSM error:",e); setOsmRestaurants([]); }
      setLoadingOsm(false);
    };
    loadOSM();
  },[city]);

  // Fusionne IOK + OSM (déduplique par proximité)
  const allRestaurants=React.useMemo(()=>{
    const iokIds=new Set();
    const result=[...iokRestaurants];
    // Marque les positions IOK
    iokRestaurants.forEach(r=>{ if(r.latitude&&r.longitude) iokIds.add(`${r.latitude.toFixed(3)},${r.longitude.toFixed(3)}`); });
    // Ajoute les OSM non-doublons (distance >50m des IOK)
    osmRestaurants.forEach(osm=>{
      if(!osm.latitude||!osm.longitude) return;
      const key=`${osm.latitude.toFixed(3)},${osm.longitude.toFixed(3)}`;
      // Vérifie si un IOK est proche (~50m)
      const duplicate=iokRestaurants.some(iok=>{
        if(!iok.latitude||!iok.longitude) return false;
        const dlat=Math.abs(iok.latitude-osm.latitude);
        const dlng=Math.abs(iok.longitude-osm.longitude);
        return dlat<0.0005&&dlng<0.0005;
      });
      if(!duplicate) result.push(osm);
    });
    return result;
  },[iokRestaurants,osmRestaurants]);

  const cityObj=CITIES.find(c=>c.id===city)||CITIES[0];

  const filtered=allRestaurants.filter(r=>{
    if(filter.cuisine!=="Toutes"){
      const cuisines=r.cuisines||[];
      if(!cuisines.some(c=>c.toLowerCase().includes(filter.cuisine.toLowerCase()))) return false;
    }
    if(filter.persons===2&&(r.nb_tables_2||0)===0&&r._iok) return false;
    if(filter.persons===4&&(r.nb_tables_4||0)===0&&r._iok) return false;
    return true;
  });

  const iokAvail=filtered.filter(r=>r._iok&&r.disponible&&r.disponible_jusqu&&new Date(r.disponible_jusqu)>new Date());
  const iokUnavail=filtered.filter(r=>r._iok&&(!r.disponible||!r.disponible_jusqu||new Date(r.disponible_jusqu)<=new Date()));
  const osmOnly=filtered.filter(r=>!r._iok);
  const allCuisines=[...new Set(iokRestaurants.flatMap(r=>r.cuisines||[]))];

  // Carte avec marqueurs colorés
  const mapRestaurants=filtered.map(r=>({...r,_markerColor:getMarkerColor(r)}));

  return(
    <PageShell onBack={onBack} backLabel="Accueil" topSlot={
      <div>
        <BrandBar subtitle="Trouver une table" right={
          <div style={{color:C.muted,fontSize:12,textAlign:"right"}}>
            <div style={{color:"#22c55e",fontWeight:700}}>{iokAvail.length} dispo.</div>
            <div style={{fontSize:10}}>en temps réel</div>
          </div>
        }/>
        {/* Sélecteur de ville avec recherche libre */}
        <div style={{position:"relative"}}>
          <button onClick={()=>setShowCityPicker(v=>!v)} style={{marginTop:10,background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 16px",color:C.text,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:8,width:"100%"}}>
            <span style={{fontSize:18}}>📍</span>
            <span style={{flex:1,textAlign:"left"}}>{cityName||cityObj.name}</span>
            <button onClick={(e)=>{e.stopPropagation();geolocateCity();}} style={{background:"rgba(59,130,246,0.15)",border:"1px solid rgba(59,130,246,0.3)",borderRadius:8,padding:"4px 10px",color:"#60a5fa",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{geoLocating?"⏳":"📡 Me localiser"}</button>
            <span style={{color:C.accent,fontSize:12}}>{showCityPicker?"▲":"▼"}</span>
          </button>
          {showCityPicker&&(
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,marginTop:4,overflow:"hidden",zIndex:1000,position:"absolute",width:"100%",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
              {/* Recherche libre */}
              <div style={{padding:"8px 12px",borderBottom:`1px solid ${C.border}`}}>
                <input value={citySearch} onChange={e=>setCitySearch(e.target.value)} placeholder="Rechercher une ville..." style={{width:"100%",background:"transparent",border:"none",outline:"none",color:C.text,fontSize:14,fontFamily:"inherit"}}/>
              </div>
              {/* Liste filtrée */}
              {CITIES.filter(c=>c.name.toLowerCase().includes(citySearch.toLowerCase())).map(c=>(
                <button key={c.id} onClick={()=>{setCity(c.id);setCityName(c.name);setShowCityPicker(false);setCitySearch("");setSelected(null);}} style={{width:"100%",padding:"12px 16px",background:c.id===city?C.accentSoft:"transparent",border:"none",borderBottom:`1px solid ${C.border}`,color:c.id===city?C.accent:C.text,fontSize:14,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                  {c.id===city?"✓ ":""}{c.name}
                </button>
              ))}
            </div>
          )}
        </div>
        {/* Mode test / distance */}
        {TEST_MODE&&(
          <div style={{marginTop:8,background:"rgba(234,179,8,0.1)",border:"1px solid rgba(234,179,8,0.2)",borderRadius:10,padding:"6px 12px",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:14}}>🧪</span>
            <span style={{color:"#eab308",fontSize:11,fontWeight:600}}>MODE TEST — restriction distance désactivée</span>
          </div>
        )}
        {/* Légende couleurs */}
        <div style={{display:"flex",gap:12,marginTop:10,flexWrap:"wrap"}}>
          {[["#22c55e","Disponible — abonné"],["#ef4444","Indisponible — abonné"],["#9ca3af","Non inscrit IOK"],["#3b82f6","Vous"]].map(([c,l])=>(
            <span key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:C.muted}}>
              <span style={{width:10,height:10,borderRadius:"50%",background:c,display:"inline-block",flexShrink:0}}/>
              {l}
            </span>
          ))}
        </div>
      </div>
    }>
      {/* Carte */}
      <LeafletMapColored
        restaurants={mapRestaurants}
        selected={selected}
        onSelect={r=>setSelected(selected?.id===r.id?null:r)}
        city={city}
        height={260}
        loading={loadingOsm}
        userLocation={userLocation}
      />

      {/* Fiche restaurant sélectionné */}
      {selected&&(()=>{
        const st=getRestoStatus(selected);
        const badge=getBadgeLabel(selected);
        const ok=selected._iok&&selected.disponible&&selected.disponible_jusqu&&new Date(selected.disponible_jusqu)>new Date();
        const tLeft=ok?Math.max(0,new Date(selected.disponible_jusqu)-new Date()):0;
        const canBook=ok&&(st==="paid"||st==="trial");
        return(
          <div style={{background:C.card,border:`2px solid ${getMarkerColor(selected)}40`,borderRadius:20,padding:18,marginBottom:14,position:"relative"}}>
            <button onClick={()=>setSelected(null)} style={{position:"absolute",top:14,right:14,background:"rgba(255,255,255,0.07)",border:"none",color:C.muted,width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>✕</button>
            <div style={{display:"flex",gap:12,marginBottom:10}}>
              <div style={{fontSize:36}}>{selected.image_emoji||"🍽️"}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{color:C.text,fontWeight:800,fontSize:17}}>{selected.nom}</div>
                  <div style={{background:badge.bg,color:badge.color,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,border:`1px solid ${badge.color}40`}}>{badge.label}</div>
                </div>
                <div style={{color:C.muted,fontSize:12,marginTop:2}}>{(selected.cuisines||[]).join(", ")||"Restaurant"}</div>
                <div style={{color:C.muted,fontSize:11}}>{selected.adresse}</div>
              </div>
            </div>

            {/* Statut dispo */}
            {selected._iok?(
              <div style={{background:ok?"rgba(34,197,94,0.1)":"rgba(107,114,128,0.1)",border:`1px solid ${ok?"rgba(34,197,94,0.3)":C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{color:ok?"#22c55e":C.muted,fontWeight:700,fontSize:14}}>{ok?"🟢 Tables disponibles":"⚫ Indisponible"}</span>
                {ok&&<span style={{color:"#86efac",fontSize:12,fontFamily:"monospace"}}>{fmt(tLeft)}</span>}
              </div>
            ):(
              <div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
                <div style={{color:"#f87171",fontWeight:600,fontSize:13}}>🔴 Ce restaurant n'est pas encore partenaire IOK</div>
                <div style={{color:C.muted,fontSize:12,marginTop:3}}>La disponibilité en temps réel n'est pas disponible</div>
              </div>
            )}

            {/* Stats */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
              {[
                {i:"💶",v:selected.prix_moyen?`${selected.prix_moyen}€`:"N/A",l:"Prix moy."},
                {i:"⭐",v:selected.note_google?`${selected.note_google}/5`:"N/A",l:"Note"},
                {i:"💬",v:selected.nb_avis_google||0,l:"Avis Google"},
              ].map(s=>(
                <div key={s.l} style={{background:C.surface,borderRadius:10,padding:"10px 0",textAlign:"center"}}>
                  <div style={{fontSize:18}}>{s.i}</div>
                  <div style={{color:C.text,fontWeight:700,fontSize:13}}>{s.v}</div>
                  <div style={{color:C.muted,fontSize:10}}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* Tables si dispo */}
            {ok&&(
              <div style={{display:"flex",gap:8,marginBottom:14}}>
                {(selected.nb_tables_2||0)>0&&<div style={{flex:1,background:"rgba(99,102,241,0.1)",border:"1px solid rgba(99,102,241,0.25)",borderRadius:10,padding:"8px 0",textAlign:"center"}}><div style={{color:"#c7d2fe",fontWeight:700,fontSize:13}}>{selected.nb_tables_2} × 2 pers.</div></div>}
                {(selected.nb_tables_4||0)>0&&<div style={{flex:1,background:"rgba(99,102,241,0.1)",border:"1px solid rgba(99,102,241,0.25)",borderRadius:10,padding:"8px 0",textAlign:"center"}}><div style={{color:"#c7d2fe",fontWeight:700,fontSize:13}}>{selected.nb_tables_4} × 4 pers.</div></div>}
                {selected.grande_disponibilite&&<div style={{flex:1,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.25)",borderRadius:10,padding:"8px 0",textAlign:"center"}}><div style={{color:"#86efac",fontWeight:700,fontSize:13}}>Grande dispo</div></div>}
              </div>
            )}

            {/* Bouton réserver */}
            {canBook&&(
              <button onClick={()=>onBook(selected)} style={{width:"100%",padding:"14px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#FF5C3A,#FF8C42)",color:"white",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",boxShadow:`0 4px 18px ${C.accentGlow}`}}>
                Réserver chez {selected.nom} →
              </button>
            )}
            {!selected._iok&&(
              <div style={{textAlign:"center",color:C.muted,fontSize:12,marginTop:4}}>
                Invitez ce restaurant à rejoindre IOK 🙌
              </div>
            )}
          </div>
        );
      })()}

      {/* Filtres */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:16,marginBottom:14}}>
        <div style={{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>Filtres</div>
        {allCuisines.length>0&&<div style={{marginBottom:12}}>
          <div style={{color:C.sub,fontSize:12,marginBottom:6}}>Cuisine</div>
          <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4}}>
            {["Toutes",...allCuisines].map(c=>(
              <button key={c} onClick={()=>setFilter(f=>({...f,cuisine:c}))} style={{whiteSpace:"nowrap",padding:"5px 12px",borderRadius:20,border:`1px solid ${filter.cuisine===c?C.accent:C.border}`,background:filter.cuisine===c?C.accentSoft:"transparent",color:filter.cuisine===c?C.accent:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{c}</button>
            ))}
          </div>
        </div>}
        <div>
          <div style={{color:C.sub,fontSize:12,marginBottom:6}}>Personnes</div>
          <div style={{display:"flex",gap:6}}>
            {[{v:0,l:"Tous"},{v:2,l:"2 pers."},{v:4,l:"4 pers."}].map(p=>(
              <button key={p.v} onClick={()=>setFilter(f=>({...f,persons:p.v}))} style={{flex:1,padding:"8px 0",borderRadius:10,border:`1px solid ${filter.persons===p.v?C.accent:C.border}`,background:filter.persons===p.v?C.accentSoft:"transparent",color:filter.persons===p.v?C.accent:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:filter.persons===p.v?700:400}}>{p.l}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Loading state */}
      {loading&&(
        <div style={{textAlign:"center",padding:"30px 0",color:C.muted}}>
          <div style={{fontSize:28,marginBottom:8,display:"inline-block"}}>⚡</div>
          <div style={{fontSize:13}}>Chargement des restaurants IOK…</div>
        </div>
      )}

      {/* Listes */}
      {!loading&&<>
        {/* Disponibles maintenant */}
        {iokAvail.length>0&&(
          <>
            <div style={{color:"#22c55e",fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>🟢 Disponibles maintenant ({iokAvail.length})</div>
            {iokAvail.map(r=>{
              const tLeft=Math.max(0,new Date(r.disponible_jusqu)-new Date());
              const badge=getBadgeLabel(r);
              return(
                <div key={r.id} onClick={()=>setSelected(r)} style={{background:selected?.id===r.id?C.accentSoft:C.card,border:`1px solid ${selected?.id===r.id?C.accent:"rgba(34,197,94,0.3)"}`,borderRadius:14,padding:"12px 14px",marginBottom:10,cursor:"pointer",display:"flex",alignItems:"center",gap:12,transition:"all 0.15s"}}>
                  <div style={{position:"relative"}}>
                    <div style={{fontSize:28}}>{r.image_emoji||"🍽️"}</div>
                    <div style={{position:"absolute",bottom:-2,right:-2,width:10,height:10,borderRadius:"50%",background:"#22c55e",border:"2px solid #0C0D0F"}}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
                      <span style={{color:C.text,fontWeight:700,fontSize:14}}>{r.nom}</span>
                      <div style={{display:"flex",gap:4,alignItems:"center"}}>
                        {r.promo_active&&r.promo_jusqu&&new Date(r.promo_jusqu)>new Date()&&(
                          <span style={{background:"rgba(34,197,94,0.2)",color:"#22c55e",fontSize:10,fontWeight:800,padding:"3px 8px",borderRadius:20,animation:"promoPulse 1.5s ease-in-out infinite",border:"1px solid #22c55e"}}>

        {/* Restaurants OSM non inscrits */}

        )}
      </>}
    </PageShell>
  );
}

  const [code, setCode] = useState(["","","","",""]);           // 5 chiffres SMS résa
  const [consentCGV, setConsentCGV] = useState(false);
  const [consentMarketing, setConsentMarketing] = useState(false);
  const [sending, setSending] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [clientData, setClientData] = useState(null);
  const inputsRef = useRef([]);
  const otpRefs = useRef([]);

  const valid = form.prenom.trim()&&form.tel.replace(/\s/g,"").length>=10&&form.tableType!==null;
  const sendSMS = ()=>{ setSending(true); setTimeout(()=>{setSending(false);setStep("sms");},1200); };

  // ── Login client ──────────────────────────────────────────
  const loginClient = async()=>{
    setError(""); setSaving(true);
    try{
      const tel = "+33"+authForm.tel.replace(/\s/g,"").replace(/^0/,"");
      const {data:client,error:e} = await db()
        .from("clients")
        .select("*")
        .eq("telephone", tel)
        .single();
      if(e||!client){ throw new Error("Numéro introuvable. Vérifiez ou créez un compte."); }
      // Vérif mot de passe (simplifié - en prod utiliser Supabase Auth)
      if(client.password_hash && client.password_hash !== authForm.password){
        throw new Error("Mot de passe incorrect.");
      }
      setClientData(client);
      setForm(f=>({...f, prenom:client.prenom, nom:client.nom, tel:authForm.tel}));
      setAuthStep("guest"); // Passe au formulaire réservation
    }catch(e){ setError(e.message); }
    finally{ setSaving(false); }
  };

  // registerClient intégré dans sendOTP/verifyOTP

  // ── Vérification code SMS + réservation ──────────────────
  const verify = async()=>{
    if(code.join("").length<5){ setError("Code invalide. Essayez 12345."); return; }
    if(!form.tableType){ setError("Veuillez choisir un type de table."); return; }
    setSaving(true);
    try{
      // Vérifie disponibilité en temps réel
      const {data:restoActuel} = await db().from("restaurants").select("nb_tables_2,nb_tables_4,disponible,disponible_jusqu").eq("id",restaurant.id).single();
      if(!restoActuel||!restoActuel.disponible) throw new Error("Ce restaurant n'est plus disponible.");
      if(restoActuel.disponible_jusqu&&new Date(restoActuel.disponible_jusqu)<new Date()) throw new Error("Le créneau a expiré.");
      const tableKey = form.tableType==="2"?"nb_tables_2":"nb_tables_4";
      if((restoActuel[tableKey]||0)<=0) throw new Error(`Plus de table pour ${form.tableType} personnes.`);

      // Décrémente le compteur
      const newCount = (restoActuel[tableKey]||0) - 1;
      const updateData = {[tableKey]:newCount, updated_at:new Date().toISOString()};
      const autreKey = form.tableType==="2"?"nb_tables_4":"nb_tables_2";
      if(newCount===0&&(restoActuel[autreKey]||0)===0){
        updateData.disponible=false; updateData.disponible_depuis=null;
        updateData.disponible_jusqu=null; updateData.grande_disponibilite=false;
      }
      const {error:updErr} = await db().from("restaurants").update(updateData).eq("id",restaurant.id);
      if(updErr){ console.error("Restaurant update error:", updErr); }

      // Crée ou retrouve le client

        const tel = "+33"+form.tel.replace(/\s/g,"").replace(/^0/,"");

          const {data:existing, error:searchErr} = await db()
            .from("clients").select("id,prenom")
            .eq("telephone",tel).maybeSingle();
          if(searchErr) console.error("❌ Recherche client:", searchErr.message);
          if(existing){
            clientId = existing.id;
            console.log("✅ Client existant trouvé:", clientId);

      const {data:resa, error:resaErr} = await db().from("reservations").insert({
        client_id:clientId||null,
        client_prenom:form.prenom,
        client_nom:form.nom||null,
        client_telephone:tel_final,
        restaurant_id:restaurant.id,
        nb_personnes:form.persons,
        table_type:form.tableType,

        sms_verifie:true,
        code_sms:code.join(""),
        timer_demarre_at:new Date().toISOString(),

      if(resaErr){
        console.error("Erreur création réservation:", resaErr);
        throw new Error("Erreur réservation: "+resaErr.message);
      }
      console.log("✅ Réservation créée:", resa);

      setStep("confirmed");
      setTimeout(()=>onSuccess({...form,restaurant}),2000);

      setError(e.message||"Erreur lors de la réservation.");
    }finally{ setSaving(false); }

            </div>
            <div style={{fontSize:12,color:C.sub,lineHeight:1.5}}>
              J'accepte les <span style={{color:C.accent}}>Conditions Générales d'Utilisation</span> et la <span style={{color:C.accent}}>Politique de confidentialité</span> d'IOK. <span style={{color:C.red}}>*</span>
              <div style={{color:C.muted,fontSize:11,marginTop:3}}>Données collectées : prénom, téléphone. Utilisées uniquement pour la gestion de vos réservations.</div>
            </div>
          </div>

          {/* Marketing optionnel */}
          <div onClick={()=>setConsentMarketing(v=>!v)} style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer"}}>
            <div style={{width:20,height:20,borderRadius:5,border:`2px solid ${consentMarketing?C.accent:C.border}`,background:consentMarketing?C.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>
              {consentMarketing&&<span style={{color:"white",fontSize:13,lineHeight:1}}>✓</span>}
            </div>
            <div style={{fontSize:12,color:C.sub,lineHeight:1.5}}>
              J'accepte de recevoir des offres personnalisées, promotions et informations liées à mon classement IOK par email/SMS. <span style={{color:C.muted}}>(optionnel)</span>
            </div>
          </div>
        </div>

        {error&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:C.red,fontSize:13}}>⚠️ {error}</div>}
        <Btn onClick={registerClient} disabled={!authForm.prenom||authOTP.join("").length<6||!consentCGV} loading={saving}>
          Créer mon compte →
        </Btn>
        <div style={{color:C.muted,fontSize:11,textAlign:"center",marginTop:10}}>
          Vous pouvez supprimer votre compte à tout moment depuis les paramètres.
        </div>
      </div>
    </PageShell>
  );

  // ── Formulaire réservation (invité ou connecté) ───────────
  return(
    <PageShell
      onBack={authStep==="sms"?()=>setStep("form"):onBack}
      backLabel={step==="sms"?"← Modifier mes infos":"← Retour"}
      topSlot={
        <><BrandBar subtitle="Réserver"/>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,background:C.accentSoft,border:`1px solid rgba(255,92,58,0.25)`,borderRadius:10,padding:"8px 12px"}}>
          <span style={{fontSize:20}}>{restaurant.image_emoji||"🍽️"}</span>
          <div><div style={{color:C.text,fontWeight:700,fontSize:14}}>{restaurant.nom}</div><div style={{color:C.accent,fontSize:12}}>{(restaurant.cuisines||[]).join(", ")} · {restaurant.adresse}</div></div>
        </div>
        {clientData&&(
          <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8,background:C.greenSoft,border:`1px solid rgba(34,197,94,0.25)`,borderRadius:10,padding:"6px 12px"}}>
            <span style={{color:C.green,fontSize:13}}>✓</span>
            <span style={{color:C.green,fontSize:12,fontWeight:600}}>Connecté : {clientData.prenom} {clientData.nom}</span>
            <FiabiliteBadge statut={clientData.fiabilite_statut||"nouveau"} small={true}/>
          </div>
        )}
        {TEST_MODE&&!clientData&&(
          <div style={{marginTop:6,background:"rgba(234,179,8,0.1)",border:`1px solid rgba(234,179,8,0.2)`,borderRadius:8,padding:"5px 10px",fontSize:11,color:"#eab308"}}>
            🧪 Mode test — connexion optionnelle
          </div>
        )}</>
      }
    >
      <div style={{paddingTop:16}}>
        {step==="form"&&<>
          <div style={{color:C.text,fontSize:21,fontWeight:800,marginBottom:2}}>Vos coordonnées</div>
          <div style={{color:C.muted,fontSize:13,marginBottom:20}}>Pour confirmer votre réservation par SMS</div>
          <FInput label="Prénom" value={form.prenom} onChange={v=>setForm(p=>({...p,prenom:v}))} placeholder="Jean" required={true} disabled={!!clientData}/>
          {/* Nom + Email optionnels */}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,marginBottom:14}}>
            <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>Optionnel — Pour recevoir des offres</div>
            <div style={{color:C.muted,fontSize:11,marginBottom:12,lineHeight:1.5}}>En renseignant ces champs, vous acceptez de recevoir des offres personnalisées et informations liées à votre statut IOK.</div>
            <FInput label="Nom de famille" value={form.nom} onChange={v=>setForm(p=>({...p,nom:v}))} placeholder="Dupont (optionnel)" disabled={!!clientData}/>
            <FInput label="Email" type="email" value={form.email} onChange={v=>setForm(p=>({...p,email:v}))} placeholder="jean@email.com (optionnel)" disabled={!!clientData}/>
          </div>
          
          <FInput label="Téléphone mobile" value={form.tel} onChange={v=>setForm(p=>({...p,tel:v}))} placeholder="06 12 34 56 78" prefix="🇫🇷 +33" type="tel" required={true} disabled={!!clientData}/>

          {/* Sélection type de table */}
          <div style={{marginBottom:18}}>
            <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Type de table <span style={{color:C.red}}>*</span></div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {(restaurant.nb_tables_2||0)>0&&(
                <button onClick={()=>setForm(p=>({...p,tableType:"2",persons:2}))}
                  style={{padding:"14px 16px",borderRadius:12,border:`2px solid ${form.tableType==="2"?C.accent:C.border}`,background:form.tableType==="2"?C.accentSoft:"transparent",color:form.tableType==="2"?C.accent:C.text,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between",transition:"all 0.15s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:22}}>👥</span>
                    <div style={{textAlign:"left"}}>
                      <div style={{fontWeight:700,fontSize:15}}>Table pour 2 personnes</div>
                      <div style={{fontSize:12,color:C.muted,marginTop:2}}>{restaurant.nb_tables_2} table{restaurant.nb_tables_2>1?"s":""} disponible{restaurant.nb_tables_2>1?"s":""}</div>
                    </div>
                  </div>
                  {form.tableType==="2"&&<span style={{color:C.accent,fontSize:18}}>✓</span>}
                </button>
              )}
              {(restaurant.nb_tables_4||0)>0&&(
                <button onClick={()=>setForm(p=>({...p,tableType:"4",persons:4}))}
                  style={{padding:"14px 16px",borderRadius:12,border:`2px solid ${form.tableType==="4"?C.accent:C.border}`,background:form.tableType==="4"?C.accentSoft:"transparent",color:form.tableType==="4"?C.accent:C.text,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between",transition:"all 0.15s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:22}}>👨‍👩‍👧‍👦</span>
                    <div style={{textAlign:"left"}}>
                      <div style={{fontWeight:700,fontSize:15}}>Table pour 4 personnes</div>
                      <div style={{fontSize:12,color:C.muted,marginTop:2}}>{restaurant.nb_tables_4} table{restaurant.nb_tables_4>1?"s":""} disponible{restaurant.nb_tables_4>1?"s":""}</div>
                    </div>
                  </div>
                  {form.tableType==="4"&&<span style={{color:C.accent,fontSize:18}}>✓</span>}
                </button>
              )}
              {(restaurant.nb_tables_2||0)===0&&(restaurant.nb_tables_4||0)===0&&(
                <div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:12,padding:"14px 16px",color:C.red,fontSize:14}}>
                  ⚠️ Plus aucune table disponible
                </div>
              )}
            </div>
          </div>
          <Btn onClick={sendSMS} disabled={!valid} loading={sending}>Valider et recevoir mon code SMS</Btn>
        </>}

        {step==="sms"&&<>
          <div style={{color:C.text,fontSize:21,fontWeight:800,marginBottom:2}}>Code SMS</div>
          <div style={{color:C.muted,fontSize:13,marginBottom:6}}>Code envoyé au +33 {form.tel}</div>
          <div style={{background:"rgba(255,92,58,0.07)",border:`1px solid rgba(255,92,58,0.2)`,borderRadius:10,padding:"10px 14px",marginBottom:20,fontSize:12,color:C.muted}}>
            💡 Code démo : <strong style={{color:C.text}}>12345</strong>
            {TEST_MODE&&<span style={{color:"#eab308",marginLeft:8}}>🧪 Mode test</span>}
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:24}}>
            {code.map((d,i)=>(
              <input key={i} ref={el=>inputsRef.current[i]=el} value={d}
                onChange={e=>handleDigit(i,e.target.value)}
                onKeyDown={e=>{if(e.key==="Backspace"&&!d&&i>0){inputsRef.current[i-1]?.focus();const nc=[...code];nc[i-1]="";setCode(nc);}}}
                maxLength={1} type="number"
                style={{width:52,height:60,borderRadius:14,textAlign:"center",fontSize:24,fontWeight:700,background:C.card,border:`2px solid ${d?C.accent:C.border}`,color:C.text,outline:"none",fontFamily:"monospace"}}/>
            ))}
          </div>
          {error&&<div style={{color:C.red,fontSize:12,textAlign:"center",marginBottom:14}}>{error}</div>}
          <Btn onClick={verify} disabled={code.join("").length<5} loading={saving}>Confirmer ma réservation ✓</Btn>
          <div style={{textAlign:"center",marginTop:14,color:C.muted,fontSize:12}}>
            Pas reçu ? <span style={{color:C.accent,cursor:"pointer"}} onClick={()=>setStep("form")}>Renvoyer</span>
          </div>
        </>}
      </div>
    </PageShell>
  );
}


/* ══ ROOT ════════════════════════════════════════════ */
function App(){
  const [screen,setScreen]=useState("splash");
  const [bookingResto,setBookingResto]=useState(null);
  const [restoUser,setRestoUser]=useState(null);
  const go=s=>setScreen(s);

  // Vérifie si déjà connecté au chargement
  useEffect(()=>{
    db().auth.getSession().then(({data})=>{
      if(data?.session) {
        // Session active — on pourrait auto-connecter ici
      }
    });
  },[]);

  return(
    <div style={{maxWidth:430,margin:"0 auto"}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      {screen==="splash"&&<Splash onStart={t=>go(t==="client"?"client-search":t==="mon-compte"?"mon-compte":"resto-login")}/>}
      {screen==="mon-compte"&&<ClientDashboard onBack={()=>go("splash")} onHome={()=>go("splash")}/>}
      {screen==="client-search"&&<ClientSearch onBack={()=>go("splash")} onHome={()=>go("splash")} onBook={r=>{setBookingResto(r);go("client-book");}}/>}
      {screen==="client-book"&&bookingResto&&<ClientBookingAuth restaurant={bookingResto} onBack={()=>go("client-search")} onHome={()=>go("splash")} onSuccess={()=>{setTimeout(()=>go("client-search"),2500);}}/>}
      {screen==="resto-login"&&<RestaurateurLogin onBack={()=>go("splash")} onHome={()=>go("splash")} onSuccess={u=>{setRestoUser(u);go("resto-app");}} onRegister={()=>go("resto-register")}/>}
      {screen==="resto-register"&&<RestaurateurAuth onSuccess={u=>{setRestoUser(u);go("resto-app");}} onBackToLogin={()=>go("resto-login")} onHome={()=>go("splash")}/>}
      {screen==="resto-app"&&restoUser&&<RestaurateurApp user={restoUser} onHome={()=>go("splash")} onLogout={async()=>{await db().auth.signOut();setRestoUser(null);go("resto-login");}}/>}
    </div>
  );
}

// Attend que IOK_DB soit prêt avant de monter React
function mountApp() {
  if (!window.IOK_DB) {
    console.error('IOK_DB non disponible - vérifiez votre SUPABASE_URL et SUPABASE_KEY');
    // Tente de l'initialiser maintenant
    try {
      if (window.supabase && window.supabase.createClient) {
        window.IOK_DB = window.supabase.createClient(
          window.SUPABASE_URL || "REMPLACE_PAR_TON_URL",
          window.SUPABASE_KEY || "REMPLACE_PAR_TA_CLE"
        );
        console.log('IOK_DB initialisé en fallback');
      }
    } catch(e) {
      console.error('Impossible d initialiser Supabase:', e);
    }
  }
  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
  const loader=document.getElementById("splash-loader");
  loader.style.transition="opacity 0.5s";
  loader.style.opacity="0";
  setTimeout(()=>loader.style.display="none",600);
}

// Lance immédiatement - IOK_DB doit déjà être init car Supabase charge avant Babel
mountApp();
  </script>
</body>
</html>
